<body>
<script>
(function(){
  var t = localStorage.getItem('cerebro_tema');
        if (t) document.body.className = 'theme-' + t;
})();
</script>
<div id="header-container"></div>
<div id="toolbar-container"></div>

<div class="admin-layout">
  <!-- tabs: real links (deep-linkable, open-in-new-tab works); JS turns them into an ARIA tablist -->
  <nav class="admin-tabs scroll-thin" id="admin-tabs" role="tablist" data-i18n-aria-label="admin.panelLabel" aria-label="Painel do GM" hidden>
    <a href="?tab=party" class="admin-tab" id="tabbtn-party" role="tab" aria-controls="tab-party" aria-selected="false" tabindex="-1"><span class="admin-tab-idx" aria-hidden="true">01</span><span data-i18n="admin.party">Party</span></a>
    <a href="?tab=encounter" class="admin-tab" id="tabbtn-encounter" role="tab" aria-controls="tab-encounter" aria-selected="false" tabindex="-1"><span class="admin-tab-idx" aria-hidden="true">02</span><span data-i18n="admin.encounter">Encontro</span><span class="admin-tab-dot" id="tab-enc-dot" hidden></span></a>
    <a href="?tab=notes" class="admin-tab" id="tabbtn-notes" role="tab" aria-controls="tab-notes" aria-selected="false" tabindex="-1"><span class="admin-tab-idx" aria-hidden="true">03</span><span data-i18n="admin.notes">Notas de Sessão</span></a>
    <a href="?tab=members" class="admin-tab" id="tabbtn-members" role="tab" aria-controls="tab-members" aria-selected="false" tabindex="-1"><span class="admin-tab-idx" aria-hidden="true">04</span><span data-i18n="admin.members">Membros</span></a>
    <a href="?tab=points" class="admin-tab" id="tabbtn-points" role="tab" aria-controls="tab-points" aria-selected="false" tabindex="-1"><span class="admin-tab-idx" aria-hidden="true">05</span><span data-i18n="admin.points">Apoio×Antagonismo</span></a>
  </nav>

  <main class="admin-content" id="admin-main">
    <!-- loading / restricted (non-GM) / no party -->
    <div id="admin-gate" class="admin-gate"><p class="state-msg is-loading" data-i18n="common.loading">// CARREGANDO...</p></div>

    <div id="admin-app" hidden>
      <header class="admin-head">
        <div class="admin-head-id">
          <div class="dwl" data-i18n="admin.partyLabel">PARTY</div>
          <h1 class="admin-party stencil stencil-fx" id="party-name"></h1>
        </div>
        <div class="admin-code">
          <span class="dwl nopre" data-i18n="admin.codeLabel">CÓDIGO DE ACESSO</span>
          <span class="admin-code-val" id="party-code"></span>
          <button type="button" class="btn btn-sm" data-act="copy-code"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12"/><path d="M5 15H3V3h12v2"/></svg><span data-i18n="admin.copyCode">Copiar</span></button>
        </div>
        <div class="admin-sync">
          <span class="admin-sync-txt" id="sync-status" role="status" aria-live="polite"></span>
          <button type="button" class="btn btn-sm" id="refresh-btn" data-act="reload"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.36"/></svg><span data-i18n="admin.refresh">Atualizar</span></button>
        </div>
      </header>

      <section id="tab-party" class="admin-panel" role="tabpanel" aria-labelledby="tabbtn-party" hidden>
        <div class="sec"><div class="sec-bar"></div><h2 class="sec-label" data-i18n="admin.allChars">Todos os Personagens</h2><div class="sec-line"></div><span class="sec-code" id="party-count"></span></div>
        <div id="party-body"></div>
      </section>

      <section id="tab-encounter" class="admin-panel" role="tabpanel" aria-labelledby="tabbtn-encounter" hidden>
        <div class="sec"><div class="sec-bar"></div><h2 class="sec-label" data-i18n="admin.encounterControl">Controle de Encontro</h2><div class="sec-line"></div><span class="sec-code">ENC-02</span></div>
        <div id="enc-body"></div>
        <section class="dossier is-muted enc-local" aria-labelledby="enc-local-title">
          <header class="dossier-hd"><h3 class="dossier-title stencil" id="enc-local-title" data-i18n="admin.cerebroEnc">No Cérebro</h3><span class="dossier-meta" id="enc-local-meta"></span></header>
          <div class="dossier-body" id="enc-local-body"></div>
        </section>
      </section>

      <section id="tab-notes" class="admin-panel" role="tabpanel" aria-labelledby="tabbtn-notes" hidden>
        <div class="sec"><div class="sec-bar"></div><h2 class="sec-label"><label for="session-notes" data-i18n="admin.notes">Notas de Sessão</label></h2><div class="sec-line"></div><span class="sec-code">LOG-03</span></div>
        <div id="notes-load"></div>
        <textarea class="form-input session-notes" id="session-notes" disabled aria-describedby="notes-status" data-i18n-placeholder="admin.notesPlaceholder" placeholder="Anote aqui os eventos da sessão..."></textarea>
        <div class="panel-acts notes-acts">
          <span class="notes-status" id="notes-status" role="status" aria-live="polite"></span>
          <button type="button" class="btn btn-sm" id="notes-retry" data-act="notes-retry" hidden><span data-i18n="admin.retry">Tentar de novo</span></button>
        </div>
      </section>

      <section id="tab-members" class="admin-panel" role="tabpanel" aria-labelledby="tabbtn-members" hidden>
        <div class="sec"><div class="sec-bar"></div><h2 class="sec-label" data-i18n="admin.members">Membros</h2><div class="sec-line"></div><span class="sec-code">MBR-04</span></div>
        <div id="members-list"></div>
      </section>

      <section id="tab-points" class="admin-panel" role="tabpanel" aria-labelledby="tabbtn-points" hidden>
        <div class="sec"><div class="sec-bar"></div><h2 class="sec-label" data-i18n="admin.points">Apoio × Antagonismo</h2><div class="sec-line"></div><span class="sec-code">PTS-05</span></div>
        <div id="points-summary"></div>
        <div id="points-list"></div>
      </section>
    </div>
  </main>
</div>

<!-- confirmation dialog (replaces confirm()): cancel is the default focus, Esc / backdrop cancel -->
<div class="modal-bg" id="confirm-bg">
  <div class="modal compact" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-msg" tabindex="-1">
    <h2 class="modal-title" id="confirm-title"></h2>
    <p class="modal-sub" id="confirm-msg"></p>
    <div class="modal-acts">
      <button type="button" class="btn" id="confirm-cancel" data-i18n="admin.cancel">Cancelar</button>
      <button type="button" class="btn btn-danger" id="confirm-ok"></button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- scripts no fim do body: HTML e CSS renderizam antes do parse do JS -->
  <script src="assets/js/config.js?v=dev"></script>
  <script src="assets/js/i18n.js?v=dev"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js?v=dev"></script>
  <script src="assets/js/cache-module.js?v=dev"></script>
  <script src="assets/js/auth-module.js?v=dev"></script>
  <script src="assets/js/api.js?v=dev"></script>
  <script src="assets/js/globals.js?v=dev"></script>
  <script src="assets/js/themes.js?v=dev"></script>
  <script src="assets/js/header.js?v=dev"></script>
  <script src="assets/js/pwa.js?v=dev"></script>
  <script>
    const $ = id => document.getElementById(id);
    const TABS = ['party', 'encounter', 'notes', 'members', 'points'];
    const TAB_KEY = 'cerebro_admin_tab';
    const ENC_KEY = 'cerebro_enc_v6'; /* cerebro.html keeps its encounter tracker in localStorage (per device) */
    const ICO_EDIT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';

    let currentAuth = null, currentParty = null, activeTab = null;
    let chars = [], members = [], charsState = 'loading', charsAt = null, charsReq = 0;
    let session = null, sessionState = 'loading';

    function hhmm(d) { return d.toLocaleTimeString(getCurrentLanguage(), { hour: '2-digit', minute: '2-digit' }); }
    function uid() { return currentAuth.session.user.id; }

    /* ═══ boot ═══ */
    async function init() {
      initLanguage();
      applyTranslations();
      initTheme();
      renderNavBar({ page: 'admin' });
      $('save-ind') && $('save-ind').setAttribute('aria-hidden', 'true'); /* notes status below is the live region */
      bindTabs();
      bindActions();
      bindNotes();
      bindConfirm();
      window.addEventListener('storage', e => { if (e.key === ENC_KEY) renderEncLocal(); });

      // no role filter here: a player who opens the panel sees "restricted", not a silent redirect
      currentAuth = await requireAuth();
      if (!currentAuth) return;
      if (currentAuth.profile.role !== 'gm') return gate('restricted');
      if (window.setGMFlag) setGMFlag(true);
      await loadParty(false);
    }

    async function loadParty(force) {
      gate('loading');
      try { currentParty = await api.getGMParty(uid(), force); }
      catch (e) { console.error('[admin] party', e); currentParty = null; return gate('loaderror'); } // network/RLS ≠ "no party"
      if (!currentParty) return gate('noparty');
      gate(null);
      $('party-name').textContent = currentParty.name || '—';
      $('party-code').textContent = currentParty.code || '—';
      showTab(tabFromUrl(), 'replace'); // every history entry carries ?tab= so Back always restores a tab
      renderEncLocal();
      loadAll();
    }

    function loadAll() { return Promise.all([loadChars(), loadSession()]); }

    /* gate = the whole-page state before the panel can show */
    function gate(kind) {
      const g = $('admin-gate');
      $('admin-app').hidden = !!kind;
      $('admin-tabs').hidden = !!kind;
      g.hidden = !kind;
      if (kind === 'loading') g.innerHTML = '<p class="state-msg is-loading">' + escH(t('common.loading')) + '</p>';
      if (kind === 'restricted') g.innerHTML = '<div class="empty-state gate-card"><div class="dwl nopre gate-code">GM-ONLY // 403</div>'
        + '<h1 class="empty-title stencil">' + escH(t('admin.restrictedTitle')) + '</h1>'
        + '<p class="empty-sub">' + escH(t('admin.restrictedSub')) + '</p>'
        + '<a class="btn btn-primary" href="dashboard.html">' + escH(t('admin.backDashboard')) + '</a></div>';
      if (kind === 'noparty') g.innerHTML = '<div class="empty-state gate-card">'
        + '<h1 class="empty-title stencil">' + escH(t('admin.noPartyTitle')) + '</h1>'
        + '<p class="empty-sub">' + escH(t('admin.noParty')) + '</p>'
        + '<div class="gate-acts"><a class="btn btn-primary" href="dashboard.html">' + escH(t('admin.createPartyCta')) + '</a>'
        + '<button type="button" class="btn" data-act="party-retry">' + escH(t('admin.retry')) + '</button></div></div>';
      if (kind === 'loaderror') g.innerHTML = '<div class="empty-state gate-card">'
        + '<h1 class="empty-title stencil">' + escH(t('common.partyErrTitle')) + '</h1>'
        + '<p class="empty-sub">' + escH(t('common.partyErrMsg')) + '</p>'
        + '<div class="gate-acts"><button type="button" class="btn btn-primary" data-act="party-retry">' + escH(t('admin.retry')) + '</button>'
        + '<a class="btn" href="dashboard.html">' + escH(t('admin.backDashboard')) + '</a></div></div>';
      const h = g.querySelector('h1');
      if (h) { h.tabIndex = -1; h.focus(); }
    }

    /* ═══ tabs: ARIA tablist, ?tab= in the URL, Back works, last tab remembered ═══ */
    function tabFromUrl() {
      const q = new URLSearchParams(location.search).get('tab');
      if (TABS.includes(q)) return q;
      let s = null; try { s = localStorage.getItem(TAB_KEY); } catch (e) {}
      return TABS.includes(s) ? s : 'party';
    }
    function showTab(id, hist) {
      if (!TABS.includes(id)) id = 'party';
      if (activeTab === 'notes' && id !== 'notes') flushNotes();
      activeTab = id;
      TABS.forEach(k => {
        const on = k === id, b = $('tabbtn-' + k);
        b.setAttribute('aria-selected', String(on));
        b.tabIndex = on ? 0 : -1;
        $('tab-' + k).hidden = !on;
      });
      try { localStorage.setItem(TAB_KEY, id); } catch (e) {}
      if (hist === 'push' || hist === 'replace') history[hist + 'State']({ tab: id }, '', '?tab=' + id);
      const b = $('tabbtn-' + id);
      if (b.scrollIntoView && !$('admin-tabs').hidden) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }
    window.showTab = showTab;
    function bindTabs() {
      const list = $('admin-tabs');
      list.addEventListener('click', e => {
        const a = e.target.closest('[role="tab"]');
        if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button) return; // let "open in new tab" through
        e.preventDefault();
        if (a.getAttribute('aria-selected') !== 'true') showTab(a.id.slice(7), 'push');
      });
      list.addEventListener('keydown', e => {
        const i = TABS.indexOf(activeTab), n = TABS.length;
        const to = { ArrowRight: i + 1, ArrowDown: i + 1, ArrowLeft: i - 1 + n, ArrowUp: i - 1 + n, Home: 0, End: n - 1 }[e.key];
        if (to === undefined) return;
        e.preventDefault();
        showTab(TABS[to % n], 'replace'); // arrowing through tabs should not flood the history
        $('tabbtn-' + activeTab).focus();
      });
      window.addEventListener('popstate', () => { if (currentParty) showTab(tabFromUrl(), 'none'); });
    }

    /* ═══ shared feedback: toast, busy buttons, confirm dialog ═══ */
    let toastT;
    function toast(msg, err) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.toggle('err', !!err);
      el.classList.add('show');
      clearTimeout(toastT);
      toastT = setTimeout(() => el.classList.remove('show'), err ? 5000 : 2500);
    }
    function busy(btn, on, label) {
      if (!btn) return;
      if (on) { btn.dataset.html = btn.innerHTML; btn.textContent = label || t('admin.notesSaving'); }
      else if (btn.dataset.html !== undefined) { btn.innerHTML = btn.dataset.html; delete btn.dataset.html; }
      btn.disabled = on;
      btn.setAttribute('aria-busy', String(on));
    }

    let confirmResolve = null, confirmReturn = null;
    function confirmar(o, trigger) {
      $('confirm-title').textContent = o.title;
      $('confirm-msg').textContent = o.body;
      $('confirm-ok').textContent = o.ok;
      confirmReturn = trigger || document.activeElement;
      $('confirm-bg').classList.add('open');
      document.body.classList.add('modal-open');
      $('confirm-cancel').focus(); // safe default: Enter on an accidental tap cancels
      return new Promise(r => { confirmResolve = r; });
    }
    function closeConfirm(ok) {
      if (!confirmResolve) return;
      $('confirm-bg').classList.remove('open');
      document.body.classList.remove('modal-open');
      const r = confirmResolve; confirmResolve = null;
      if (confirmReturn && confirmReturn.isConnected) confirmReturn.focus();
      r(ok);
    }
    function bindConfirm() {
      const bg = $('confirm-bg');
      $('confirm-cancel').addEventListener('click', () => closeConfirm(false));
      $('confirm-ok').addEventListener('click', () => closeConfirm(true));
      bg.addEventListener('click', e => { if (e.target === bg) closeConfirm(false); });
      bg.addEventListener('keydown', e => {
        if (e.key === 'Escape') { e.preventDefault(); closeConfirm(false); }
        if (e.key === 'Tab') { // two buttons: keep focus inside
          e.preventDefault();
          (document.activeElement === $('confirm-ok') ? $('confirm-cancel') : $('confirm-ok')).focus();
        }
      });
    }

    function bindActions() {
      document.addEventListener('click', e => {
        const b = e.target.closest('[data-act]');
        if (!b) return;
        const act = b.dataset.act;
        if (act === 'reload') loadAll();
        else if (act === 'party-retry') loadParty(true);
        else if (act === 'copy-code') copyCode();
        else if (act === 'enc-toggle') toggleEncounter(b);
        else if (act === 'notes-retry') saveNotes();
      });
    }

    async function copyCode() {
      const code = currentParty && currentParty.code;
      if (!code) return;
      try { await navigator.clipboard.writeText(code); toast(t('admin.codeCopied') + ' ' + code); }
      catch (e) { toast(t('admin.codeCopyFail') + ' ' + code, true); }
    }

    /* ═══ characters: one fetch feeds Party, Members and Points ═══ */
    async function loadChars() {
      const my = ++charsReq;
      charsState = 'loading';
      renderCharTabs();
      renderSync();
      try {
        // players = sheet owners ∪ party_members rows (joined by code, maybe no sheet yet); a failed
        // membership read only loses the sheetless ones, so it must not fail the whole panel
        const [res, mem] = await Promise.all([
          api.listAllGMCharacters(uid(), true),
          api.getPartyMembers(currentParty.id, true).catch(e => { console.warn('[admin] party_members', e); return []; })
        ]);
        if (my !== charsReq) return;
        chars = Array.isArray(res) ? res : [];
        members = (mem || []).map(m => m.player_id).filter(id => id && id !== currentParty.gm_id);
        charsState = 'ok';
        charsAt = new Date();
      } catch (e) {
        if (my !== charsReq) return;
        console.error('[admin] characters', e);
        charsState = 'error';
      }
      renderCharTabs();
      renderSync();
    }
    function renderSync() {
      const btn = $('refresh-btn');
      const loading = charsState === 'loading' || sessionState === 'loading' || !!sessionLoad;
      btn.disabled = loading;
      btn.setAttribute('aria-busy', String(loading));
      $('sync-status').textContent = loading ? t('common.loading')
        : charsState === 'error' || sessionState === 'error' ? t('admin.syncError')
        : t('admin.loadedAt').replace('{t}', hhmm(charsAt || new Date()));
      $('sync-status').classList.toggle('is-err', !loading && (charsState === 'error' || sessionState === 'error'));
    }
    function stateHTML(kind, msgKey) {
      if (kind === 'loading') return '<p class="state-msg is-loading">' + escH(t('common.loading')) + '</p>';
      return '<div class="state-msg is-error"><span>' + escH(t(msgKey)) + '</span> <button type="button" class="btn btn-sm" data-act="reload">' + escH(t('admin.retry')) + '</button></div>';
    }
    function emptyRosterHTML() {
      return '<div class="empty-state"><div class="empty-title stencil">' + escH(t('admin.emptyTitle')) + '</div>'
        + '<p class="empty-sub">' + escH(t('admin.emptySub')) + ' <strong class="admin-code-val">' + escH(currentParty.code || '') + '</strong></p>'
        + '<button type="button" class="btn btn-primary" data-act="copy-code">' + escH(t('admin.copyCode')) + '</button></div>';
    }
    function renderCharTabs() {
      $('party-count').textContent = charsState === 'ok' ? String(chars.length).padStart(2, '0') + ' // CHR' : 'CHR-01';
      const targets = [$('party-body'), $('members-list'), $('points-list')];
      if (charsState !== 'ok' || (!chars.length && !members.length)) {
        const html = charsState === 'ok' ? emptyRosterHTML() : stateHTML(charsState, 'admin.loadError');
        targets.forEach(el => { el.innerHTML = html; });
        $('points-summary').innerHTML = '';
        return;
      }
      renderParty();
      renderMembers();
      renderPoints();
    }

    /* players in first-appearance order; the same numbering on every tab */
    function porJogador(list) {
      const m = new Map();
      list.forEach(c => { const k = c.player_id || '?'; if (!m.has(k)) m.set(k, []); m.get(k).push(c); });
      members.forEach(id => { if (!m.has(id)) m.set(id, []); }); // members without a sheet come last
      return [...m.entries()];
    }
    function avatarHTML(c) {
      const foto = c.foto_base64 || '';
      if (/^(data:image\/|https:)/.test(foto)) return '<img class="r-av" src="' + escH(foto) + '" alt="" loading="lazy">';
      const ini = ((c.codinome || c.nome || '?').trim().charAt(0) || '?').toUpperCase();
      return '<span class="r-av" aria-hidden="true">' + escH(ini) + '</span>';
    }
    function charIdHTML(c) {
      return '<div class="r-id">' + avatarHTML(c) + '<div class="r-names"><span class="r-name">' + escH(c.nome || t('admin.noName')) + '</span>'
        + (c.codinome ? '<span class="r-code">' + escH(c.codinome) + '</span>' : '') + '</div></div>';
    }
    function renderParty() {
      if (!chars.length) { $('party-body').innerHTML = emptyRosterHTML(); return; }
      const grupos = porJogador(chars);
      const rows = [];
      const jogDe = c => (c && c.data && typeof c.data.jogador === 'string' && c.data.jogador.trim()) || '';
      grupos.forEach(([pid, pChars], i) => pChars.forEach(c => {
        // the sheet's own "jogador" field, else another sheet of the same account, else "Jogador N"
        const jog = jogDe(c) || pChars.map(jogDe).find(Boolean) || (t('admin.player') + ' ' + (i + 1));
        rows.push('<tr><td class="r-char">' + charIdHTML(c) + '</td>'
          + '<td class="r-player" data-label="' + escH(t('admin.colPlayer')) + '">' + escH(jog) + '</td>'
          + '<td class="r-acts"><a class="btn btn-sm" href="ficha.html?id=' + encodeURIComponent(c.id) + '">' + ICO_EDIT + '<span>' + escH(t('admin.editSheet')) + '</span></a></td></tr>');
      }));
      $('party-body').innerHTML = '<table class="roster"><caption class="sr-only">' + escH(t('admin.allChars')) + '</caption>'
        + '<thead><tr><th scope="col">' + escH(t('admin.colChar')) + '</th><th scope="col">' + escH(t('admin.colPlayer')) + '</th><th scope="col"><span class="sr-only">' + escH(t('admin.colActions')) + '</span></th></tr></thead>'
        + '<tbody>' + rows.join('') + '</tbody></table>';
    }

    function renderMembers() {
      $('members-list').innerHTML = porJogador(chars).map(([pid, pChars], i) => {
        const jog = rotuloJogador(pChars, i);
        return '<section class="dossier mbr-card"><header class="dossier-hd"><span class="mbr-av" aria-hidden="true">' + escH((jog.charAt(0) || '?').toUpperCase()) + '</span>'
          + '<h3 class="dossier-title stencil">' + escH(jog) + '</h3><span class="dossier-meta">' + escH(pChars.length ? pChars.length + ' ' + t('admin.charCount') : t('dash.noSheet')) + '</span></header>'
          + '<ul class="dossier-body mbr-list">' + pChars.map(c => '<li class="mbr-row">' + charIdHTML(c)
            + '<a class="btn btn-sm" href="ficha.html?id=' + encodeURIComponent(c.id) + '">' + ICO_EDIT + '<span>' + escH(t('admin.editSheet')) + '</span></a></li>').join('')
          + '</ul></section>';
      }).join('');
    }

    function safeNum(v){ v = parseFloat(v); return isFinite(v) && v > 0 ? v : 0; }
    /* Não existe tabela de perfis (auth é Supabase Auth): o nome legível de um jogador é o campo
       "jogador" das fichas dele, senão os nomes dos personagens. Nunca o player_id cru. */
    const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    function nomeChar(c){ return (c && (c.codinome || c.nome)) || ''; }
    function rotuloJogador(pChars, i){
      const jog = [...new Set(pChars.map(c => c && c.data && typeof c.data.jogador === 'string' ? c.data.jogador.trim() : '').filter(Boolean))];
      if (jog.length) return jog.join(' · ');
      const ns = [...new Set(pChars.map(nomeChar).filter(Boolean))];
      return ns.length ? ns.join(' · ') : t('admin.player') + ' ' + (i + 1);
    }
    /* membro salvo como id de personagem: resolve pelo nome; sem match, nunca mostra o uuid */
    function nomeMembro(nome, porId){
      if (!UUID_RE.test(nome)) return nome;
      return nomeChar(porId[nome.toLowerCase()]) || t('admin.unknownChar');
    }
    function membrosDe(c, porId){
      const d = (c && c.data) || {};
      const raw = Array.isArray(d.membros) ? d.membros : [];
      return raw.filter(m => m && m.nome && String(m.nome).trim())
        .map(m => ({ nome: nomeMembro(String(m.nome).trim(), porId || {}), apoio: safeNum(m.apoio), antagonismo: safeNum(m.antagonismo) }));
    }
    function barraHTML(v, total, cls){
      const pct = total > 0 ? Math.min(100, Math.round((v / total) * 100)) : 0;
      return '<div class="pts-bar" aria-hidden="true"><div class="pts-bar-fill ' + cls + '" style="width:' + pct + '%"></div></div><span class="pts-val">' + v + '</span>';
    }
    function escH(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function renderPoints() {
      const porId = {};
      chars.forEach(c => { if (c.id) porId[String(c.id).toLowerCase()] = c; });
      const A = escH(t('admin.pointsColApoio')), ANT = escH(t('admin.pointsColAnt'));
      let gA = 0, gAnt = 0;
      const grupos = porJogador(chars);
      const blocks = grupos.map(([pid, pChars], i) => {
        let pA = 0, pAnt = 0;
        const charBlocks = pChars.map(c => {
          const ms = membrosDe(c, porId);
          const ca = ms.reduce((s, m) => s + m.apoio, 0), cAnt = ms.reduce((s, m) => s + m.antagonismo, 0);
          pA += ca; pAnt += cAnt;
          const nome = nomeChar(c) || t('admin.noName');
          const body = ms.length
            ? '<table class="pts-table"><caption class="sr-only">' + escH(nome) + '</caption><thead><tr><th scope="col">' + escH(t('admin.pointsMember')) + '</th><th scope="col">' + A + '</th><th scope="col">' + ANT + '</th></tr></thead><tbody>'
              + ms.map(m => '<tr><th scope="row" class="pts-m-nome">' + escH(m.nome) + '</th>'
                + '<td data-label="' + A + '"><div class="pts-cell">' + barraHTML(m.apoio, ca || m.apoio, 'is-a') + '</div></td>'
                + '<td data-label="' + ANT + '"><div class="pts-cell">' + barraHTML(m.antagonismo, cAnt || m.antagonismo, 'is-ant') + '</div></td></tr>').join('')
              + '</tbody></table>'
            : '<p class="pts-empty">' + escH(t('admin.pointsNoMembers')) + '</p>';
          return '<div class="pts-char"><div class="pts-char-head"><span class="pts-char-name">' + escH(nome) + '</span>'
            + '<span class="pts-char-total" title="' + escH(t('admin.pointsTotal')) + '">A+' + ca + ' · ANT+' + cAnt + '</span></div>' + body + '</div>';
        }).join('');
        gA += pA; gAnt += pAnt;
        const jog = rotuloJogador(pChars, i);
        return '<section class="dossier pts-player"><header class="dossier-hd pts-player-head">'
          + '<span class="mbr-av" aria-hidden="true">' + escH((jog.charAt(0) || '?').toUpperCase()) + '</span>'
          + '<div class="pts-player-id"><h3 class="dossier-title stencil">' + escH(jog) + '</h3>'
          + '<span class="dossier-meta">' + pChars.length + ' ' + escH(t('admin.charCount')) + ' · A+' + pA + ' · ANT+' + pAnt + '</span></div>'
          + '<div class="pts-player-bars">'
          + '<div class="pts-pair"><span class="pts-pair-lbl">A</span>' + barraHTML(pA, pA + pAnt, 'is-a') + '</div>'
          + '<div class="pts-pair"><span class="pts-pair-lbl">ANT</span>' + barraHTML(pAnt, pA + pAnt, 'is-ant') + '</div>'
          + '</div></header><div class="pts-chars">' + (charBlocks || '<p class="pts-empty">' + escH(t('dash.noSheet')) + '</p>') + '</div></section>';
      });
      const grand = gA + gAnt;
      $('points-summary').innerHTML = '<div class="pts-summary">'
        + '<div class="pts-sum-item"><span class="pts-sum-lbl">' + escH(t('admin.pointsPlayers')) + '</span><span class="pts-sum-val">' + grupos.length + '</span></div>'
        + '<div class="pts-sum-item"><span class="pts-sum-lbl">' + escH(t('admin.pointsApoio')) + '</span><span class="pts-sum-val">' + gA + '</span></div>'
        + '<div class="pts-sum-item"><span class="pts-sum-lbl">' + escH(t('admin.pointsAnt')) + '</span><span class="pts-sum-val">' + gAnt + '</span></div>'
        + '<div class="pts-sum-item pts-sum-wide"><span class="pts-sum-lbl">' + escH(t('admin.pointsDist')) + '</span>'
        + '<div class="pts-pair"><span class="pts-pair-lbl">A</span>' + barraHTML(gA, grand, 'is-a') + '</div>'
        + '<div class="pts-pair"><span class="pts-pair-lbl">ANT</span>' + barraHTML(gAnt, grand, 'is-ant') + '</div>'
        + '</div></div>';
      $('points-list').innerHTML = blocks.join('');
    }

    /* ═══ session: encounter flag + notes (one row per party) ═══ */
    // Single flight: every caller (Refresh, retry buttons, init) joins the load already running, so two reads
    // never overlap — an older snapshot answering after the GM typed and saved would otherwise restore stale notes.
    let sessionLoad = null;
    function loadSession() {
      if (!sessionLoad) { sessionLoad = readSession(); renderSync(); } // Refresh stays busy through the save wait too
      return sessionLoad;
    }
    async function readSession() {
      // land pending/in-flight notes first: a read started before the save commits can return the old notes,
      // and once the save marks them 'saved' renderSession would put that stale snapshot back in the textarea.
      // From 'loading' on, saveNotes is a no-op and the textarea is disabled, so no save can overlap the read.
      while (N.inflight || N.state === 'pending') await saveNotes();
      sessionState = 'loading';
      renderSession();
      renderSync();
      try {
        session = (await api.getSession(currentParty.id)) || { notes: '', encounter: [] };
        sessionState = 'ok';
      } catch (e) {
        console.error('[admin] session', e);
        sessionState = 'error';
      }
      sessionLoad = null;
      renderSession();
      renderSync();
    }
    function renderSession() {
      const ta = $('session-notes');
      ta.disabled = sessionState !== 'ok'; // never let the GM type over notes that did not load
      $('notes-load').innerHTML = sessionState === 'ok' ? '' : stateHTML(sessionState, 'admin.sessionError');
      if (sessionState === 'ok' && !notesDirty()) {
        ta.value = session.notes || '';
        N.saved = ta.value;
        if (N.state === 'idle') setNotes('idle');
      }
      renderEncounter();
    }

    function encActive() { return !!session && Array.isArray(session.encounter) && session.encounter.includes('active'); }
    function renderEncounter() {
      const el = $('enc-body');
      $('tab-enc-dot').hidden = !encActive();
      if (sessionState !== 'ok') { el.innerHTML = stateHTML(sessionState, 'admin.sessionError'); return; }
      const on = encActive();
      el.innerHTML = '<section class="dossier enc-card' + (on ? ' is-on' : '') + '" aria-labelledby="enc-title">'
        + '<header class="dossier-hd"><h3 class="dossier-title stencil" id="enc-title">' + escH(t('admin.encStatus')) + '</h3>'
        + '<span class="badge' + (on ? ' is-solid' : '') + '" style="--c:' + (on ? 'var(--enc)' : 'var(--muted)') + '">' + escH(on ? t('admin.encActive') : t('admin.encIdle')) + '</span></header>'
        + '<div class="dossier-body"><p class="enc-desc">' + escH(on ? t('admin.encOnDesc') : t('admin.encOffDesc')) + '</p>'
        + '<div class="panel-acts"><button type="button" class="btn ' + (on ? 'btn-danger' : 'btn-primary') + '" data-act="enc-toggle">' + escH(on ? t('admin.endEncounter') : t('admin.startEncounter')) + '</button>'
        + '<a class="btn" href="cerebro.html">' + escH(t('admin.manageInCerebro')) + '</a></div></div></section>';
    }
    async function toggleEncounter(btn) {
      const next = !encActive();
      if (!next && !(await confirmar({ title: t('admin.confirmEndTitle'), body: t('admin.confirmEndBody'), ok: t('admin.endEncounter') }, btn))) return;
      busy(btn, true);
      try {
        const enc = next ? ['active'] : [];
        await api.updateSession(currentParty.id, { encounter: enc }); // only the encounter: notes stay as stored
        session.encounter = enc;
        toast(t(next ? 'admin.encStarted' : 'admin.encEnded'));
      } catch (e) {
        console.error('[admin] encounter', e);
        toast(t('admin.encSaveError'), true);
      }
      renderEncounter();
      const nb = $('enc-body').querySelector('[data-act="enc-toggle"]');
      if (nb) nb.focus();
    }

    function renderEncLocal() {
      let enc = null;
      try { enc = JSON.parse(localStorage.getItem(ENC_KEY) || 'null'); } catch (e) {}
      const ps = enc && Array.isArray(enc.participantes) ? enc.participantes : [];
      const meta = $('enc-local-meta'), body = $('enc-local-body');
      meta.textContent = ps.length ? t('admin.encRound') + ' ' + (enc.rodada || 1) + ' · ' + ps.length + ' NPC' : t('admin.thisDevice');
      body.innerHTML = (ps.length
        ? '<ul class="enc-list">' + ps.map(p => {
            const n = Array.isArray(p.condicoes) ? p.condicoes.length : 0;
            return '<li><span class="enc-npc">' + escH(p.nome || '—') + '</span>' + (n ? '<span class="badge" style="--c:var(--enc)">' + n + ' ' + escH(t('admin.encConds')) + '</span>' : '') + '</li>';
          }).join('') + '</ul>'
        : '<p class="enc-desc">' + escH(t('admin.encNone')) + '</p>')
        + '<div><a class="btn btn-sm" href="cerebro.html">' + escH(t(ps.length ? 'admin.manageInCerebro' : 'admin.selectNpcs')) + '</a></div>';
    }

    /* ═══ notes autosave: pending → saving → saved HH:MM | error (+retry); flushed on blur / hide / leave ═══ */
    const N = { state: 'idle', saved: '', savedAt: null, timer: null, inflight: null, again: false };
    function notesDirty() { return N.state === 'pending' || N.state === 'saving' || N.state === 'error'; }
    function setNotes(state) {
      N.state = state;
      const txt = {
        idle: t('admin.notesHint'), pending: t('admin.notesPending'), saving: t('admin.notesSaving'),
        saved: t('admin.notesSavedAt').replace('{t}', N.savedAt ? hhmm(N.savedAt) : ''), error: t('admin.notesError')
      }[state];
      const st = $('notes-status');
      st.textContent = txt;
      st.className = 'notes-status is-' + state;
      $('notes-retry').hidden = state !== 'error';
      const ind = $('save-ind'); // desktop toolbar mirror (aria-hidden: the panel status is the live region)
      if (ind) { ind.textContent = state === 'idle' ? '' : txt; ind.className = 'save-ind ' + ({ pending: 'pendente', saving: 'salvando', saved: 'salvo', error: 'erro' }[state] || ''); }
    }
    function saveNotes() {
      clearTimeout(N.timer); N.timer = null;
      if (N.inflight) { N.again = true; return N.inflight; }
      const ta = $('session-notes'), val = ta.value;
      if (!currentParty || sessionState !== 'ok') return Promise.resolve();
      if (val === N.saved && N.state !== 'error') { setNotes(N.savedAt ? 'saved' : 'idle'); return Promise.resolve(); }
      setNotes('saving');
      N.inflight = api.updateSession(currentParty.id, { notes: val }).then(() => { // notes only: encounter/round untouched
        N.inflight = null; N.saved = val; N.savedAt = new Date();
        if (session) session.notes = val;
        if (N.again) { N.again = false; return saveNotes(); }
        setNotes(ta.value === val ? 'saved' : 'pending');
      }, e => {
        N.inflight = null; N.again = false;
        console.error('[admin] notes', e);
        setNotes('error');
      });
      return N.inflight;
    }
    function flushNotes() { if (N.state === 'pending' || N.state === 'error') saveNotes(); }
    function bindNotes() {
      const ta = $('session-notes');
      ta.addEventListener('input', () => {
        setNotes('pending');
        clearTimeout(N.timer);
        N.timer = setTimeout(saveNotes, 1000);
      });
      ta.addEventListener('blur', flushNotes);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushNotes(); });
      // ponytail: supabase-js fetch has no keepalive, so a save started on pagehide is best effort; the
      // beforeunload prompt below is what actually protects unsaved notes on in-app navigation.
      window.addEventListener('pagehide', flushNotes);
      window.addEventListener('beforeunload', e => {
        flushNotes();
        if (notesDirty()) { e.preventDefault(); e.returnValue = ''; }
      });
    }

    init();
  </script>
</body>
</html>
