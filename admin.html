<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/img/x-logo.svg">
  <title>X-MEN TTRPG // PAINEL DO GM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Oswald:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Oswald:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Oswald:wght@400;600;700&display=swap"></noscript>
<link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/admin.css">
  <script src="assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/cache-module.js"></script>
  <script src="assets/js/auth-module.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/globals.js"></script>
  <script src="assets/js/themes.js"></script>
</head>
<body>
<script>
(function(){
  var t = localStorage.getItem('cerebro_tema');
  console.log('[theme] localStorage:', t, 'body class:', document.body.className);
        if (t) document.body.className = 'theme-' + t;
})();
</script>
<header class="header">
    <div class="header-logo">
      <a href="dashboard.html" class="x-logo">
        <svg class="x-logo-svg" viewBox="0 0 64 64" fill="none">
          <rect x="2" y="2" width="60" height="60" rx="3" stroke="var(--accent)" stroke-width="3"/>
          <rect x="8" y="8" width="48" height="48" rx="1" stroke="var(--accent)" stroke-width="1" opacity=".3"/>
          <line x1="16" y1="16" x2="48" y2="48" stroke="var(--accent)" stroke-width="4.5" stroke-linecap="square"/>
          <line x1="48" y1="16" x2="16" y2="48" stroke="var(--accent)" stroke-width="4.5" stroke-linecap="square"/>
          <rect class="logo-ext" x="27" y="3" width="10" height="3.5" fill="var(--accent)" opacity=".6"/>
          <rect class="logo-ext" x="27" y="57.5" width="10" height="3.5" fill="var(--accent)" opacity=".6"/>
          <rect class="logo-ext" x="3" y="27" width="3.5" height="10" fill="var(--accent)" opacity=".6"/>
          <rect class="logo-ext" x="57.5" y="27" width="3.5" height="10" fill="var(--accent)" opacity=".6"/>
        </svg>
      </a>
      <div class="hdr-title">
        <h1>X-MEN</h1>
        <span class="hdr-sub">PAINEL DO GM</span>
      </div>
    </div>
    <div class="hdr-spacer"></div>
  </header>

  <div class="toolbar">
    <a href="dashboard.html" class="tbtn">Dashboard</a>
    <a href="ficha.html" class="tbtn">Ficha</a>
    <a href="wiki.html" class="tbtn">Wiki</a>
    <div class="toolbar-spacer"></div>
    <div class="theme-switcher" style="border-left:none;padding:0;">
      <div class="theme-dots-row" id="theme-dots-row"></div>
    </div>
  </div>

  <div class="admin-layout">
    <nav class="admin-sidebar">
      <a href="admin.html?tab=party" class="admin-nav-link" data-tab="party">Party</a>
      <a href="admin.html?tab=encounter" class="admin-nav-link" data-tab="encounter">Encontro</a>
      <a href="admin.html?tab=notes" class="admin-nav-link" data-tab="notes">Notas de Sessão</a>
      <a href="admin.html?tab=members" class="admin-nav-link" data-tab="members">Membros</a>
    </nav>

    <main class="admin-content">
      <div id="no-party-msg" class="no-party" style="display: none;">
        Você não é GM de nenhuma party. Crie ou entre em uma party para acessar o painel.
      </div>

      <div id="party-admin-content">
        <div id="tab-party" class="admin-section">
          <div class="admin-section-header">
            <span class="admin-section-title">Todos os Personagens</span>
            <button class="btn" onclick="refreshCharacters()">⟳ Atualizar</button>
          </div>
          <div class="chars-grid" id="party-chars-grid"></div>
        </div>

        <!-- Character Edit Modal -->
        <div id="char-edit-modal" class="modal" style="display:none;">
          <div class="modal-overlay" onclick="closeCharModal()"></div>
          <div class="modal-content">
            <div class="modal-header">
              <span class="modal-title" id="char-modal-title">Editar Personagem</span>
              <button class="modal-close" onclick="closeCharModal()">×</button>
            </div>
            <div class="modal-body" id="char-modal-body">
              <!-- Character data will be loaded here -->
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" onclick="closeCharModal()">Cancelar</button>
              <button class="btn btn-primary" onclick="saveCharData()">Salvar</button>
            </div>
          </div>
        </div>

        <div id="tab-encounter" class="admin-section">
          <div class="admin-section-header">
            <span class="admin-section-title">Controle de Encontro</span>
          </div>
          <div class="encounter-controls">
            <div class="encounter-toggle">
              <button class="btn" id="toggle-encounter-btn">Iniciar Encontro</button>
            </div>
            <div class="enc-counter">
              <span class="enc-counter-label">Rodada</span>
              <button class="enc-counter-btn" id="round-dec">-</button>
              <span class="enc-counter-value" id="round-value">0</span>
              <button class="enc-counter-btn" id="round-inc">+</button>
            </div>
          </div>
          <div class="quick-actions">
            <a href="cerebro.html" class="btn">Selecionar NPCs</a>
          </div>
        </div>

        <div id="tab-notes" class="admin-section">
          <div class="admin-section-header">
            <span class="admin-section-title">Notas de Sessão</span>
          </div>
          <textarea class="session-notes" id="session-notes" placeholder="Anote aqui os eventos da sessão..."></textarea>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/cache-module.js"></script>
  <script src="assets/js/auth-module.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/globals.js"></script>
  <script>
  let currentParty = null;
  let currentRound = 0;
  let encounterActive = false;
  let currentAuth = null;

    async function init() {
      initTheme();
      renderThemeDots();
      
      const params = new URLSearchParams(window.location.search);
      const tab = params.get('tab') || 'party';
      showTab(tab);
      
      currentAuth = await requireAuth('gm');
      if (!currentAuth) return;

      currentParty = await api.getGMParty(currentAuth.session.user.id);
      
      if (!currentParty) {
        document.getElementById('no-party-msg').style.display = 'block';
        document.getElementById('party-admin-content').style.display = 'none';
        return;
      }

      await loadPartyCharacters();
      await loadSessionNotes();
      await loadEncounterState();
    }

    function showTab(tabId) {
      document.querySelectorAll('.admin-nav-link').forEach(link => {
        link.classList.toggle('active', link.dataset.tab === tabId);
      });
      document.getElementById('tab-party').style.display = tabId === 'party' ? 'block' : 'none';
      document.getElementById('tab-encounter').style.display = tabId === 'encounter' ? 'block' : 'none';
      document.getElementById('tab-notes').style.display = tabId === 'notes' ? 'block' : 'none';
    }

    window.showTab = showTab;

    let charsOffset = 0;
    const CHARS_LIMIT = 20;

    async function loadPartyCharacters(append) {
      try {
        const gmId = currentAuth.session.user.id;
        const grid = document.getElementById('party-chars-grid');
        
        if (!append) {
          charsOffset = 0;
          grid.innerHTML = '<div class="loading-skeleton"><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div></div>';
        }
        
        const chars = await api.listAllGMCharacters(gmId, false, charsOffset, CHARS_LIMIT);
        console.log('[loadPartyCharacters] chars:', chars);
        
        if (!append) grid.innerHTML = '';
        
        if (!chars || chars.length === 0) {
          if (!append) grid.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px;">Nenhum personagem encontrado</p>';
          return;
        }
        
        console.log('[loadPartyCharacters] rendering', chars.length, 'cards');
        chars.forEach(char => {
          const card = document.createElement('a');
          card.className = 'char-card';
          card.href = 'ficha.html?id=' + char.id + '&t=' + Date.now();
          card.target = '_blank';
          const initial = char.codinome ? char.codinome.charAt(0).toUpperCase() : (char.nome ? char.nome.charAt(0).toUpperCase() : '?');
          const foto = char.foto_base64 || '';
          card.innerHTML = foto 
            ? '<div class="char-card-img" style="background-image:url(' + foto + ')"></div>'
            : '<div class="char-card-avatar">' + initial + '</div>';
          card.innerHTML += '<div class="char-card-info"><div class="char-card-name">' + (char.nome || 'Sem Nome') + '</div><div class="char-card-player">' + (char.player_name || char.player_id || '—') + '</div></div><div class="char-card-party">' + (char.party_name || 'Sem Party') + '</div>';
          grid.appendChild(card);
        });
        
        charsOffset += chars.length;
        
        if (chars.length === CHARS_LIMIT) {
          const loadMore = document.getElementById('load-more-chars');
          if (!loadMore) {
            const btn = document.createElement('button');
            btn.id = 'load-more-chars';
            btn.className = 'load-more-btn';
            btn.textContent = 'Carregar mais...';
            btn.onclick = () => loadPartyCharacters(true);
            grid.parentNode.appendChild(btn);
          }
        } else {
          const loadMore = document.getElementById('load-more-chars');
          if (loadMore) loadMore.remove();
        }
      } catch (e) {
        console.error('[loadPartyCharacters error]', e);
        document.getElementById('party-chars-grid').innerHTML = '<p style="color:var(--red);text-align:center;padding:20px;">Erro: ' + e.message + '</p>';
      }
    }

    window.refreshCharacters = async function() {
      await api.listAllGMCharacters(currentAuth.session.user.id, true);
      await loadPartyCharacters(false);
    };

    let currentEditingChar = null;

    window.editCharacter = async function(charId) {
      try {
        const char = await api.loadCharacter(charId);
        currentEditingChar = char;
        document.getElementById('char-modal-title').textContent = 'Editar: ' + (char.nome || 'Sem Nome');
        
        const data = char.data || {};
        
        document.getElementById('char-modal-body').innerHTML = `
          <div class="char-edit-form">
            <div class="char-edit-section">
              <h4>Informações Básicas</h4>
              <div class="char-edit-row">
                <label>Nome</label>
                <input type="text" id="edit-char-name" value="${char.nome || ''}">
              </div>
              <div class="char-edit-row">
                <label>Codename</label>
                <input type="text" id="edit-char-codename" value="${char.codename || ''}">
              </div>
            </div>
            
            <div class="char-edit-section">
              <h4>Atributos</h4>
              <div class="char-data-editor" id="atributos-editor">
                ${renderCharDataFields(data.atributos || {}, 'atributos')}
              </div>
              <button class="add-field-btn" onclick="addCharDataField('atributos')">+ Adicionar Atributo</button>
            </div>
            
            <div class="char-edit-section">
              <h4>Tags</h4>
              <div class="char-data-editor" id="tags-editor">
                ${renderCharDataFields(data.tags || [], 'tags')}
              </div>
              <button class="add-field-btn" onclick="addCharDataField('tags')">+ Adicionar Tag</button>
            </div>
            
            <div class="char-edit-section">
              <h4>Poderes</h4>
              <div class="char-data-editor" id="poderes-editor">
                ${renderCharDataFields(data.poderes || {}, 'poderes')}
              </div>
              <button class="add-field-btn" onclick="addCharDataField('poderes')">+ Adicionar Poder</button>
            </div>
            
            <div class="char-edit-section">
              <h4>Notas</h4>
              <div class="char-edit-row">
                <label>Descrição</label>
                <textarea id="edit-char-desc" rows="3">${data.descricao || ''}</textarea>
              </div>
              <div class="char-edit-row">
                <label>Background</label>
                <textarea id="edit-char-background" rows="3">${data.background || ''}</textarea>
              </div>
            </div>
          </div>
        `;
        
        document.getElementById('char-edit-modal').style.display = 'flex';
      } catch (e) {
        console.error('[editCharacter error]', e);
        alert('Erro ao carregar personagem: ' + e.message);
      }
    };

    function renderCharDataFields(objOrArr, prefix) {
      if (Array.isArray(objOrArr)) {
        return objOrArr.map((item, i) => `
          <div class="char-data-field" data-index="${i}" data-type="array">
            <input type="text" value="${typeof item === 'object' ? JSON.stringify(item) : item}" data-key="${i}">
            <button class="remove-field" onclick="removeCharDataField(this, '${prefix}', ${i})">×</button>
          </div>
        `).join('');
      } else if (typeof objOrArr === 'object') {
        return Object.entries(objOrArr).map(([key, val], i) => `
          <div class="char-data-field" data-index="${i}" data-keyname="${key}">
            <input type="text" value="${key}" placeholder="chave" data-key="${key}">
            <input type="text" value="${typeof val === 'object' ? JSON.stringify(val) : val}" placeholder="valor">
            <button class="remove-field" onclick="removeCharDataField(this, '${prefix}', '${key}')">×</button>
          </div>
        `).join('');
      }
      return '';
    }

    window.addCharDataField = function(prefix) {
      const container = document.getElementById(prefix + '-editor');
      const isArray = prefix === 'tags';
      const field = document.createElement('div');
      field.className = 'char-data-field';
      if (isArray) {
        field.innerHTML = `
          <input type="text" placeholder="nova tag" data-key="${container.children.length}">
          <button class="remove-field" onclick="removeCharDataField(this, '${prefix}', ${container.children.length})">×</button>
        `;
      } else {
        field.innerHTML = `
          <input type="text" placeholder="chave" data-key="newkey">
          <input type="text" placeholder="valor">
          <button class="remove-field" onclick="removeCharDataField(this, '${prefix}', 'newkey')">×</button>
        `;
      }
      container.appendChild(field);
    };

    window.removeCharDataField = function(btn, prefix, index) {
      btn.parentElement.remove();
    };

    window.saveCharData = async function() {
      if (!currentEditingChar) return;
      
      try {
        const name = document.getElementById('edit-char-name').value;
        const codename = document.getElementById('edit-char-codename').value;
        
        const atributos = collectCharData('atributos-editor');
        const tags = collectCharData('tags-editor', true);
        const poderes = collectCharData('poderes-editor');
        const descricao = document.getElementById('edit-char-desc').value;
        const background = document.getElementById('edit-char-background').value;
        
        const newData = {
          ...currentEditingChar.data,
          atributos,
          tags,
          poderes,
          descricao,
          background
        };
        
        await api.saveCharacter(currentEditingChar.id, {
          name: name,
          codename: codename,
          data: newData
        });
        
        closeCharModal();
        await loadPartyCharacters();
        alert('Personagem salvo com sucesso!');
      } catch (e) {
        console.error('[saveCharData error]', e);
        alert('Erro ao salvar: ' + e.message);
      }
    };

    function collectCharData(editorId, asArray = false) {
      const container = document.getElementById(editorId);
      const fields = container.querySelectorAll('.char-data-field');
      const result = asArray ? [] : {};
      
      fields.forEach(field => {
        const inputs = field.querySelectorAll('input');
        if (asArray && inputs[0]?.value) {
          result.push(inputs[0].value);
        } else if (!asArray && inputs.length >= 2 && inputs[0]?.value) {
          result[inputs[0].value] = inputs[1]?.value || '';
        }
      });
      
      return result;
    }

    window.closeCharModal = function() {
      document.getElementById('char-edit-modal').style.display = 'none';
      currentEditingChar = null;
    };

    window.deleteCharacter = async function(charId) {
      if (!confirm('Tem certeza que deseja excluir este personagem? Esta ação não pode ser desfeita.')) return;
      
      try {
        await api.deleteCharacter(charId);
        await loadPartyCharacters();
        alert('Personagem excluído.');
      } catch (e) {
        console.error('[deleteCharacter error]', e);
        alert('Erro ao excluir: ' + e.message);
      }
    };

    async function loadSessionNotes() {
      const session = await api.getSession(currentParty.id);
      if (session) {
        document.getElementById('session-notes').value = session.notes || '';
        currentRound = session.round || 0;
        encounterActive = session.encounter && session.encounter.length > 0;
        updateEncounterUI();
      }
    }

    async function loadEncounterState() {
      document.getElementById('round-value').textContent = currentRound;
    }

    function updateEncounterUI() {
      const btn = document.getElementById('toggle-encounter-btn');
      if (encounterActive) {
        btn.textContent = 'Encerrar Encontro';
        btn.classList.add('btn-primary');
      } else {
        btn.textContent = 'Iniciar Encontro';
        btn.classList.remove('btn-primary');
      }
      document.getElementById('round-value').textContent = currentRound;
    }

    document.getElementById('toggle-encounter-btn').addEventListener('click', async () => {
      encounterActive = !encounterActive;
      if (!encounterActive) currentRound = 0;
      updateEncounterUI();
      await saveSessionState();
    });

    document.getElementById('round-inc').addEventListener('click', async () => {
      currentRound++;
      document.getElementById('round-value').textContent = currentRound;
      await saveSessionState();
    });

    document.getElementById('round-dec').addEventListener('click', async () => {
      if (currentRound > 0) {
        currentRound--;
        document.getElementById('round-value').textContent = currentRound;
        await saveSessionState();
      }
    });

    let notesTimeout;
    document.getElementById('session-notes').addEventListener('input', async (e) => {
      clearTimeout(notesTimeout);
      notesTimeout = setTimeout(async () => {
        await saveSessionState();
      }, 1000);
    });

    async function saveSessionState() {
      const notes = document.getElementById('session-notes').value;
      await api.updateSession(currentParty.id, {
        title: `Sessão - ${new Date().toLocaleDateString()}`,
        notes,
        round: currentRound,
        encounter: encounterActive ? ['active'] : []
      });
    }
    
    function toggleSettings() {
      document.getElementById('settings-dropdown').classList.toggle('open');
    }
    
    function renderThemeDots() {
      var themes = [
        { id: 'yellow', color: '#FFD600' },
        { id: 'red', color: '#E8001C' },
        { id: 'green', color: '#00C853' },
        { id: 'purple', color: '#b040ff' },
        { id: 'blue', color: '#3a8fc0' }
      ];
      var current = getCurrentTheme();
      var container = document.getElementById('theme-dots-row');
      if (!container) return;
      container.innerHTML = themes.map(function(t) {
        return '<div class="theme-dot-sm ' + (t.id === current ? 'active' : '') + '" style="background:' + t.color + '" onclick="setTheme(\'' + t.id + '\');renderThemeDots();" title="' + t.name + '"></div>';
      }).join('');
    }

    init();
    
    // Save bar
    var saveBar = document.createElement('div');
    saveBar.id = 'save-bar';
    saveBar.className = 'save-bar';
    saveBar.innerHTML = '<div class="save-status"><span class="save-dot"></span><span class="save-text">AGUARDANDO</span></div><span class="save-timestamp"></span>';
    document.body.appendChild(saveBar);
  </script>
</body>
</html>
