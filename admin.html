<body>
<script>
(function(){
  var t = localStorage.getItem('cerebro_tema');
  console.log('[theme] localStorage:', t, 'body class:', document.body.className);
        if (t) document.body.className = 'theme-' + t;
})();
</script>
<div id="header-container"></div>
<div id="toolbar-container"></div>

  <div class="admin-layout">
    <nav class="admin-sidebar">
      <a href="admin.html?tab=party" class="admin-nav-link" data-tab="party" data-i18n="admin.party">Party</a>
      <a href="admin.html?tab=encounter" class="admin-nav-link" data-tab="encounter" data-i18n="admin.encounter">Encontro</a>
      <a href="admin.html?tab=notes" class="admin-nav-link" data-tab="notes" data-i18n="admin.notes">Notas de Sessão</a>
      <a href="admin.html?tab=members" class="admin-nav-link" data-tab="members" data-i18n="admin.members">Membros</a>
      <a href="admin.html?tab=points" class="admin-nav-link" data-tab="points" data-i18n="admin.points">Apoio×Antagonismo</a>
    </nav>

    <main class="admin-content">
      <div id="no-party-msg" class="no-party" style="display: none;" data-i18n="admin.noParty">
        Você não é GM de nenhuma party. Crie ou entre em uma party para acessar o painel.
      </div>

      <div id="party-admin-content">
        <div id="tab-party" class="admin-section">
          <div class="admin-section-header">
            <span class="admin-section-title" data-i18n="admin.allChars">Todos os Personagens</span>
            <button class="btn" onclick="refreshCharacters()" data-i18n="admin.refresh">⟳ Atualizar</button>
          </div>
          <div class="chars-grid" id="party-chars-grid"></div>
        </div>

        <!-- Character Edit Modal -->
        <div id="char-edit-modal" class="modal" style="display:none;">
          <div class="modal-overlay" onclick="closeCharModal()"></div>
          <div class="modal-content">
            <div class="modal-header">
              <span class="modal-title" id="char-modal-title" data-i18n="admin.editChar">Editar Personagem</span>
              <button class="modal-close" onclick="closeCharModal()">×</button>
            </div>
            <div class="modal-body" id="char-modal-body">
              <!-- Character data will be loaded here -->
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" onclick="closeCharModal()" data-i18n="admin.cancel">Cancelar</button>
              <button class="btn btn-primary" onclick="saveCharData()" data-i18n="admin.save">Salvar</button>
            </div>
          </div>
        </div>

        <div id="tab-encounter" class="admin-section">
          <div class="admin-section-header">
            <span class="admin-section-title" data-i18n="admin.encounterControl">Controle de Encontro</span>
          </div>
          <div class="encounter-controls">
            <div class="encounter-toggle">
              <button class="btn" id="toggle-encounter-btn" data-i18n="admin.startEncounter">Iniciar Encontro</button>
            </div>
          </div>
          <div class="quick-actions">
            <a href="cerebro.html" class="btn" data-i18n="admin.selectNpcs">Selecionar NPCs</a>
          </div>
        </div>

        <div id="tab-notes" class="admin-section">
          <div class="admin-section-header">
            <span class="admin-section-title" data-i18n="admin.notes">Notas de Sessão</span>
          </div>
          <textarea class="session-notes" id="session-notes" data-i18n-placeholder="admin.notesPlaceholder" placeholder="Anote aqui os eventos da sessão..."></textarea>
        </div>

        <div id="tab-members" class="admin-section">
          <div class="admin-section-header">
            <span class="admin-section-title" data-i18n="admin.members">Membros</span>
            <button class="btn" onclick="loadMembers(true)" data-i18n="admin.refresh">⟳ Atualizar</button>
          </div>
          <div id="members-list"></div>
        </div>

        <div id="tab-points" class="admin-section">
          <div class="admin-section-header">
            <span class="admin-section-title" data-i18n="admin.points">Apoio × Antagonismo</span>
            <button class="btn" onclick="loadPoints(true)" data-i18n="admin.refresh">⟳ Atualizar</button>
          </div>
          <div id="points-summary"></div>
          <div id="points-list"></div>
        </div>
      </div>
</main>
  </div>

  <!-- scripts no fim do body: HTML e CSS renderizam antes do parse do JS -->
  <script src="assets/js/config.js?v=dev"></script>
  <script src="assets/js/i18n.js?v=dev"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js?v=dev"></script>
  <script src="assets/js/cache-module.js?v=dev"></script>
  <script src="assets/js/auth-module.js?v=dev"></script>
  <script src="assets/js/api.js?v=dev"></script>
  <script src="assets/js/globals.js?v=dev"></script>
  <script src="assets/js/themes.js?v=dev"></script>
  <script src="assets/js/header.js?v=dev"></script>
  <script src="assets/js/pwa.js?v=dev"></script>
  <!-- Scripts already loaded in <head> -->
  <script>
let currentParty = null;

    async function init() {
      initLanguage();
      applyTranslations();
      initTheme();
      renderNavBar({ page: 'admin' });
      
      const params = new URLSearchParams(window.location.search);
      const tab = params.get('tab') || 'party';
      showTab(tab);
      
      currentAuth = await requireAuth('gm');
      if (!currentAuth) return;

      currentParty = await api.getGMParty(currentAuth.session.user.id);
      
      if (!currentParty) {
        document.getElementById('no-party-msg').style.display = 'block';
        document.getElementById('party-admin-content').style.display = 'none';
        return;
      }

      await loadPartyCharacters();
      await loadSessionNotes();
    }

    function showTab(tabId) {
      document.querySelectorAll('.admin-nav-link').forEach(link => {
        link.classList.toggle('active', link.dataset.tab === tabId);
      });
      document.getElementById('tab-party').style.display = tabId === 'party' ? 'block' : 'none';
      document.getElementById('tab-encounter').style.display = tabId === 'encounter' ? 'block' : 'none';
      document.getElementById('tab-notes').style.display = tabId === 'notes' ? 'block' : 'none';
      document.getElementById('tab-members').style.display = tabId === 'members' ? 'block' : 'none';
      document.getElementById('tab-points').style.display = tabId === 'points' ? 'block' : 'none';
      if (tabId === 'members' && currentParty) loadMembers();
      if (tabId === 'points' && currentParty) loadPoints();
    }

    window.showTab = showTab;

    let charsOffset = 0;
    const CHARS_LIMIT = 20;

    async function loadPartyCharacters(append) {
      try {
        const gmId = currentAuth.session.user.id;
        const grid = document.getElementById('party-chars-grid');
        
        if (!append) {
          charsOffset = 0;
          grid.innerHTML = '<div class="loading-skeleton"><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div></div>';
        }
        
        const chars = await api.listAllGMCharacters(gmId, false, charsOffset, CHARS_LIMIT);
        console.log('[loadPartyCharacters] chars:', chars);
        
        if (!append) grid.innerHTML = '';
        
        if (!chars || chars.length === 0) {
          if (!append) grid.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px;" data-i18n="admin.noChars">' + t('admin.noChars') + '</p>';
          return;
        }
        
        console.log('[loadPartyCharacters] rendering', chars.length, 'cards');
        chars.forEach(char => {
          const card = document.createElement('a');
          card.className = 'char-card';
          card.href = 'ficha.html?id=' + char.id + '&t=' + Date.now();
          card.target = '_blank';
          const initial = char.codinome ? char.codinome.charAt(0).toUpperCase() : (char.nome ? char.nome.charAt(0).toUpperCase() : '?');
          const foto = char.foto_base64 || '';
          card.innerHTML = foto 
            ? '<div class="char-card-img" style="background-image:url(' + foto + ')"></div>'
            : '<div class="char-card-avatar">' + initial + '</div>';
          card.innerHTML += '<div class="char-card-info"><div class="char-card-name">' + (char.nome || t('admin.noName')) + '</div><div class="char-card-player">' + (char.player_name || char.player_id || '—') + '</div></div><div class="char-card-party">' + (char.party_name || t('admin.noPartyName')) + '</div>';
          grid.appendChild(card);
        });
        
        charsOffset += chars.length;
        
        if (chars.length === CHARS_LIMIT) {
          const loadMore = document.getElementById('load-more-chars');
          if (!loadMore) {
            const btn = document.createElement('button');
            btn.id = 'load-more-chars';
            btn.className = 'load-more-btn';
            btn.textContent = t('admin.loadMore');
            btn.onclick = () => loadPartyCharacters(true);
            grid.parentNode.appendChild(btn);
          }
        } else {
          const loadMore = document.getElementById('load-more-chars');
          if (loadMore) loadMore.remove();
        }
      } catch (e) {
        console.error('[loadPartyCharacters error]', e);
        document.getElementById('party-chars-grid').innerHTML = '<p style="color:var(--red);text-align:center;padding:20px;">' + t('admin.error') + ' ' + e.message + '</p>';
      }
    }

    window.refreshCharacters = async function() {
      await api.listAllGMCharacters(currentAuth.session.user.id, true);
      await loadPartyCharacters(false);
    };

    let currentEditingChar = null;

    window.editCharacter = async function(charId) {
      try {
        const char = await api.loadCharacter(charId);
        currentEditingChar = char;
        document.getElementById('char-modal-title').textContent = t('admin.editing') + ' ' + (char.nome || t('admin.noName'));
        
        const data = char.data || {};
        
        document.getElementById('char-modal-body').innerHTML = `
          <div class="char-edit-form">
            <div class="char-edit-section">
              <h4>${t('admin.basicInfo')}</h4>
              <div class="char-edit-row">
                ${t('common.name')}
                <input type="text" id="edit-char-name" value="${char.nome || ''}">
              </div>
              <div class="char-edit-row">
                ${t('common.codename')}
                <input type="text" id="edit-char-codename" value="${char.codename || ''}">
              </div>
            </div>
            
            <div class="char-edit-section">
              <h4>${t('admin.attributes')}</h4>
              <div class="char-data-editor" id="atributos-editor">
                ${renderCharDataFields(data.atributos || {}, 'atributos')}
              </div>
              <button class="add-field-btn" onclick="addCharDataField('atributos')">${t('admin.addAttribute')}</button>
            </div>
            
            <div class="char-edit-section">
              <h4>${t('admin.tags')}</h4>
              <div class="char-data-editor" id="tags-editor">
                ${renderCharDataFields(data.tags || [], 'tags')}
              </div>
              <button class="add-field-btn" onclick="addCharDataField('tags')">${t('admin.addTag')}</button>
            </div>
            
            <div class="char-edit-section">
              <h4>${t('admin.powers')}</h4>
              <div class="char-data-editor" id="poderes-editor">
                ${renderCharDataFields(data.poderes || {}, 'poderes')}
              </div>
              <button class="add-field-btn" onclick="addCharDataField('poderes')">${t('admin.addPower')}</button>
            </div>
            
            <div class="char-edit-section">
              <h4>${t('admin.notesSection')}</h4>
              <div class="char-edit-row">
                <label>${t('admin.description')}</label>
                <textarea id="edit-char-desc" rows="3">${data.descricao || ''}</textarea>
              </div>
              <div class="char-edit-row">
                <label>${t('admin.background')}</label>
                <textarea id="edit-char-background" rows="3">${data.background || ''}</textarea>
              </div>
            </div>
          </div>
        `;
        
        document.getElementById('char-edit-modal').style.display = 'flex';
      } catch (e) {
        console.error('[editCharacter error]', e);
        alert(t('admin.errorLoadChar') + ' ' + e.message);
      }
    };

    function renderCharDataFields(objOrArr, prefix) {
      if (Array.isArray(objOrArr)) {
        return objOrArr.map((item, i) => `
          <div class="char-data-field" data-index="${i}" data-type="array">
            <input type="text" value="${typeof item === 'object' ? JSON.stringify(item) : item}" data-key="${i}">
            <button class="remove-field" onclick="removeCharDataField(this, '${prefix}', ${i})">×</button>
          </div>
        `).join('');
      } else if (typeof objOrArr === 'object') {
        return Object.entries(objOrArr).map(([key, val], i) => `
          <div class="char-data-field" data-index="${i}" data-keyname="${key}">
            <input type="text" value="${key}" placeholder="${t('admin.keyPlaceholder')}" data-key="${key}">
            <input type="text" value="${typeof val === 'object' ? JSON.stringify(val) : val}" placeholder="${t('admin.valuePlaceholder')}">
            <button class="remove-field" onclick="removeCharDataField(this, '${prefix}', '${key}')">×</button>
          </div>
        `).join('');
      }
      return '';
    }

    window.addCharDataField = function(prefix) {
      const container = document.getElementById(prefix + '-editor');
      const isArray = prefix === 'tags';
      const field = document.createElement('div');
      field.className = 'char-data-field';
      if (isArray) {
        field.innerHTML = `
          <input type="text" placeholder="${t('admin.tagPlaceholder')}" data-key="${container.children.length}">
          <button class="remove-field" onclick="removeCharDataField(this, '${prefix}', ${container.children.length})">×</button>
        `;
      } else {
        field.innerHTML = `
          <input type="text" placeholder="${t('admin.keyPlaceholder')}" data-key="newkey">
          <input type="text" placeholder="${t('admin.valuePlaceholder')}">
          <button class="remove-field" onclick="removeCharDataField(this, '${prefix}', 'newkey')">×</button>
        `;
      }
      container.appendChild(field);
    };

    window.removeCharDataField = function(btn, prefix, index) {
      btn.parentElement.remove();
    };

    window.saveCharData = async function() {
      if (!currentEditingChar) return;
      
      try {
        const name = document.getElementById('edit-char-name').value;
        const codename = document.getElementById('edit-char-codename').value;
        
        const atributos = collectCharData('atributos-editor');
        const tags = collectCharData('tags-editor', true);
        const poderes = collectCharData('poderes-editor');
        const descricao = document.getElementById('edit-char-desc').value;
        const background = document.getElementById('edit-char-background').value;
        
        const newData = {
          ...currentEditingChar.data,
          atributos,
          tags,
          poderes,
          descricao,
          background
        };
        
        await api.saveCharacter(currentEditingChar.id, {
          name: name,
          codename: codename,
          data: newData
        });
        
        closeCharModal();
        await loadPartyCharacters();
        alert(t('admin.savedChar'));
      } catch (e) {
        console.error('[saveCharData error]', e);
        alert(t('admin.errorSaveChar') + ' ' + e.message);
      }
    };

    function collectCharData(editorId, asArray = false) {
      const container = document.getElementById(editorId);
      const fields = container.querySelectorAll('.char-data-field');
      const result = asArray ? [] : {};
      
      fields.forEach(field => {
        const inputs = field.querySelectorAll('input');
        if (asArray && inputs[0]?.value) {
          result.push(inputs[0].value);
        } else if (!asArray && inputs.length >= 2 && inputs[0]?.value) {
          result[inputs[0].value] = inputs[1]?.value || '';
        }
      });
      
      return result;
    }

    window.closeCharModal = function() {
      document.getElementById('char-edit-modal').style.display = 'none';
      currentEditingChar = null;
    };

    window.deleteCharacter = async function(charId) {
      if (!confirm(t('admin.confirmDelete'))) return;
      
      try {
        await api.deleteCharacter(charId);
        await loadPartyCharacters();
        alert(t('admin.deletedChar'));
      } catch (e) {
        console.error('[deleteCharacter error]', e);
        alert(t('admin.errorDeleteChar') + ' ' + e.message);
      }
    };

    let membersLoaded = false;
    async function loadMembers(force) {
      if (membersLoaded && !force) return;
      membersLoaded = true;
      const el = document.getElementById('members-list');
      el.innerHTML = '<p style="color:var(--muted);font-family:var(--mono);font-size:.52rem;padding:20px 0">' + t('common.loading') + '</p>';
      try {
        const gmId = currentAuth.session.user.id;
        const chars = await api.listAllGMCharacters(gmId, !!force);
        if (!chars || chars.length === 0) {
          el.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px;font-family:var(--mono);font-size:.52rem">' + t('admin.noChars') + '</p>';
          return;
        }
        // group by player_id
        const byPlayer = {};
        chars.forEach(c => {
          const pid = c.player_id || '?';
          if (!byPlayer[pid]) byPlayer[pid] = [];
          byPlayer[pid].push(c);
        });
        el.innerHTML = '';
        Object.entries(byPlayer).forEach(([pid, pChars]) => {
          const block = document.createElement('div');
          block.style.cssText = 'margin-bottom:18px;border:1px solid var(--b1);background:var(--p1);';
          const hdr = document.createElement('div');
          hdr.className = 'member-card';
          hdr.style.cssText = 'background:var(--p2);border-bottom:1px solid var(--b2);';
          const av = document.createElement('div');
          av.className = 'member-avatar';
          av.textContent = pid.charAt(0).toUpperCase();
          const info = document.createElement('div');
          info.className = 'member-info';
          info.innerHTML = '<div class="member-name">' + (pid.length > 36 ? pid.slice(0,8)+'…' : pid) + '</div><div class="member-username">' + pChars.length + ' ' + t('admin.charCount') + '</div>';
          hdr.appendChild(av);
          hdr.appendChild(info);
          block.appendChild(hdr);
          pChars.forEach(c => {
            const row = document.createElement('div');
            row.style.cssText = 'display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--b1);';
            const foto = c.foto_base64 || '';
            const initial = c.codinome ? c.codinome.charAt(0).toUpperCase() : (c.nome ? c.nome.charAt(0).toUpperCase() : '?');
            const thumb = document.createElement('div');
            thumb.style.cssText = 'width:36px;height:36px;flex-shrink:0;background:var(--p2);border:1px solid var(--b2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.7rem;color:var(--muted);';
            if (foto) { thumb.style.backgroundImage='url('+foto+')'; thumb.style.backgroundSize='cover'; thumb.style.backgroundPosition='center'; }
            else thumb.textContent = initial;
            const cinfo = document.createElement('div');
            cinfo.style.cssText = 'flex:1;min-width:0;';
            cinfo.innerHTML = '<div style="font-family:var(--body);font-size:.78rem;color:var(--white);font-weight:600">' + (c.nome || t('admin.noName')) + '</div>'
              + (c.codename ? '<div style="font-family:var(--mono);font-size:.44rem;color:var(--muted)">' + c.codename + '</div>' : '');
            const editBtn = document.createElement('a');
            editBtn.href = 'ficha.html?id=' + c.id;
            editBtn.target = '_blank';
            editBtn.className = 'btn btn-primary';
            editBtn.style.cssText = 'font-size:.46rem;padding:4px 10px;white-space:nowrap;';
            editBtn.textContent = t('admin.editSheet');
            row.appendChild(thumb);
            row.appendChild(cinfo);
            row.appendChild(editBtn);
            block.appendChild(row);
          });
          el.appendChild(block);
        });
      } catch(e) {
        el.innerHTML = '<p style="color:var(--red);padding:20px;font-family:var(--mono);font-size:.52rem">' + t('admin.error') + ' ' + e.message + '</p>';
      }
    }

    let pointsLoaded = false;
    function safeNum(v){ v = parseFloat(v); return isFinite(v) && v > 0 ? v : 0; }
    function membrosDe(c){
      const d = (c && c.data) || {};
      const raw = Array.isArray(d.membros) ? d.membros : [];
      return raw.filter(m => m && m.nome && String(m.nome).trim())
        .map(m => ({ nome: String(m.nome).trim(), apoio: safeNum(m.apoio), antagonismo: safeNum(m.antagonismo) }));
    }
    function barraHTML(v, total, cor){
      const pct = total > 0 ? Math.min(100, Math.round((v / total) * 100)) : 0;
      return '<div class="pts-bar"><div class="pts-bar-fill" style="width:' + pct + '%;background:' + cor + '"></div></div><span class="pts-val">' + v + '</span>';
    }
    function escH(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    async function loadPoints(force) {
      if (pointsLoaded && !force) return;
      pointsLoaded = true;
      const listEl = document.getElementById('points-list');
      const sumEl = document.getElementById('points-summary');
      listEl.innerHTML = '<p style="color:var(--muted);font-family:var(--mono);font-size:.52rem;padding:20px 0">' + t('common.loading') + '</p>';
      try {
        const gmId = currentAuth.session.user.id;
        const chars = await api.listAllGMCharacters(gmId, !!force);
        if (!chars || chars.length === 0) {
          listEl.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px;font-family:var(--mono);font-size:.52rem">' + t('admin.noChars') + '</p>';
          sumEl.innerHTML = '';
          return;
        }
        const byPlayer = {};
        chars.forEach(c => {
          const pid = c.player_id || '?';
          if (!byPlayer[pid]) byPlayer[pid] = [];
          byPlayer[pid].push(c);
        });

        let gTotalApoio = 0, gTotalAnt = 0, gPlayers = 0;
        const rows = [];
        Object.entries(byPlayer).forEach(([pid, pChars]) => {
          let pApoio = 0, pAnt = 0;
          const charBlocks = pChars.map(c => {
            const ms = membrosDe(c);
            const ca = ms.reduce((s, m) => s + m.apoio, 0);
            const cAnt = ms.reduce((s, m) => s + m.antagonismo, 0);
            pApoio += ca; pAnt += cAnt;
            const nome = c.codinome || c.nome || t('admin.noName');
            const rowsHtml = ms.length ? ms.map(m =>
              '<tr><td class="pts-m-nome">' + escH(m.nome) + '</td><td class="pts-cell-a">' + barraHTML(m.apoio, ca || m.apoio, 'var(--accent2)') + '</td><td class="pts-cell-ant">' + barraHTML(m.antagonismo, cAnt || m.antagonismo, 'var(--pr-alto)') + '</td></tr>').join('')
              : '<tr><td colspan="3" class="pts-empty">' + t('admin.pointsNoMembers') + '</td></tr>';
            return '<div class="pts-char">'
              + '<div class="pts-char-head"><span class="pts-char-name">' + escH(nome) + '</span>'
              + '<span class="pts-char-total" title="' + t('admin.pointsTotal') + '">A+' + ca + ' · ANT+' + cAnt + '</span></div>'
              + '<table class="pts-table"><thead><tr><th>' + t('admin.pointsMember') + '</th><th>A</th><th>ANT</th></tr></thead><tbody>' + rowsHtml + '</tbody></table>'
              + '</div>';
          }).join('');
          gTotalApoio += pApoio; gTotalAnt += pAnt; gPlayers++;
          rows.push('<div class="pts-player"><div class="pts-player-head">'
            + '<div class="member-avatar">' + escH((pid.charAt(0) || '?').toUpperCase()) + '</div>'
            + '<div class="member-info"><div class="member-name">' + escH(pid.length > 36 ? pid.slice(0, 8) + '…' : pid) + '</div>'
            + '<div class="member-username">' + pChars.length + ' ' + t('admin.charCount') + ' · A+' + pApoio + ' · ANT+' + pAnt + '</div></div>'
            + '<div class="pts-player-bars">'
            + '<div class="pts-pair"><span class="pts-pair-lbl">A</span>' + barraHTML(pApoio, pApoio + pAnt, 'var(--accent2)') + '</div>'
            + '<div class="pts-pair"><span class="pts-pair-lbl">ANT</span>' + barraHTML(pAnt, pApoio + pAnt, 'var(--pr-alto)') + '</div>'
            + '</div></div><div class="pts-chars">' + charBlocks + '</div></div>');
        });

        const grand = gTotalApoio + gTotalAnt;
        sumEl.innerHTML = '<div class="pts-summary">'
          + '<div class="pts-sum-item"><span class="pts-sum-lbl">' + t('admin.pointsPlayers') + '</span><span class="pts-sum-val">' + gPlayers + '</span></div>'
          + '<div class="pts-sum-item"><span class="pts-sum-lbl">' + t('admin.pointsApoio') + '</span><span class="pts-sum-val">' + gTotalApoio + '</span></div>'
          + '<div class="pts-sum-item"><span class="pts-sum-lbl">' + t('admin.pointsAnt') + '</span><span class="pts-sum-val">' + gTotalAnt + '</span></div>'
          + '<div class="pts-sum-item pts-sum-wide"><span class="pts-sum-lbl">' + t('admin.pointsDist') + '</span>'
          + '<div class="pts-pair"><span class="pts-pair-lbl">A</span>' + barraHTML(gTotalApoio, grand, 'var(--accent2)') + '</div>'
          + '<div class="pts-pair"><span class="pts-pair-lbl">ANT</span>' + barraHTML(gTotalAnt, grand, 'var(--pr-alto)') + '</div>'
          + '</div></div>';
        listEl.innerHTML = rows.join('') || '<p class="pts-empty">' + t('admin.noChars') + '</p>';
      } catch (e) {
        listEl.innerHTML = '<p style="color:var(--red);padding:20px;font-family:var(--mono);font-size:.52rem">' + t('admin.error') + ' ' + e.message + '</p>';
      }
    }

    async function loadSessionNotes() {
      const session = await api.getSession(currentParty.id);
      if (session) {
        document.getElementById('session-notes').value = session.notes || '';
        const encActive = Array.isArray(session.encounter) && session.encounter.includes('active');
        const btn = document.getElementById('toggle-encounter-btn');
        btn.dataset.active = String(encActive);
        btn.textContent = encActive ? t('admin.endEncounter') : t('admin.startEncounter');
        btn.classList.toggle('btn-primary', encActive);
      }
    }

    document.getElementById('toggle-encounter-btn').addEventListener('click', async () => {
      const btn = document.getElementById('toggle-encounter-btn');
      const active = btn.dataset.active === 'true';
      const next = !active;
      btn.dataset.active = String(next);
      btn.textContent = next ? t('admin.endEncounter') : t('admin.startEncounter');
      btn.classList.toggle('btn-primary', next);
      await saveSessionState(next);
    });

    async function saveSessionState(encounterActive) {
      try {
        await api.updateSession(currentParty.id, {
          notes: document.getElementById('session-notes').value,
          encounter: encounterActive ? ['active'] : []
        });
      } catch(e) { console.error('save session', e); }
    }

    let notesTimeout;
    document.getElementById('session-notes').addEventListener('input', async (e) => {
      clearTimeout(notesTimeout);
      notesTimeout = setTimeout(async () => {
        const notes = document.getElementById('session-notes').value;
        await api.updateSession(currentParty.id, { notes });
      }, 1000);
    });
    
    function toggleSettings() {
      document.getElementById('settings-dropdown').classList.toggle('open');
    }
    
    init();
    
    // Save bar
    var saveBar = document.createElement('div');
    saveBar.id = 'save-bar';
    saveBar.className = 'save-bar';
    saveBar.innerHTML = '<div class="save-status"><span class="save-dot"></span><span class="save-text" data-i18n="admin.waiting">' + t('admin.waiting') + '</span></div><span class="save-timestamp"></span>';
    document.body.appendChild(saveBar);
  </script>
</body>
</html>
