name: CI

on:
  pull_request:
    branches: [main, feature/gh-pages]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── LINT & SYNTAX ─────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Syntax-check all JS modules
        run: |
          ERRORS=0
          for f in $(find assets/js -name "*.js" -type f); do
            if ! node --check "$f" 2>&1; then
              ERRORS=$((ERRORS+1))
            fi
          done
          if [ $ERRORS -gt 0 ]; then
            echo "::error::$ERRORS JS file(s) have syntax errors"
            exit 1
          fi
          echo "✓ All JS files pass syntax check"

      - name: Check HTML structure
        run: |
          echo "Verifying key elements exist in HTML pages…"
          ERRORS=0
          for page in dashboard.html ficha.html admin.html cerebro.html combate.html wiki.html index.html; do
            if [ ! -f "$page" ]; then
              echo "::error::$page not found"
              ERRORS=$((ERRORS+1))
              continue
            fi
            # Must have viewport meta
            if ! grep -q 'name="viewport"' "$page"; then
              echo "::warning::$page missing viewport meta"
            fi
            # Must reference mobile.css
            if ! grep -q 'mobile.css' "$page"; then
              echo "::warning::$page missing mobile.css"
            fi
            echo "✓ $page"
          done
          exit $ERRORS

  # ── UNIT TESTS ────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npx playwright test tests/unit.test.js --reporter=list
        continue-on-error: true

  # ── DEPLOY DRY-RUN (PRs only) ─────────────────────────────────────────
  dry-run:
    name: Build Dry-Run
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Simulate env injection
        run: |
          echo "Simulating env var injection (dry run)…"
          find . -name "*.js" -not -path "*/node_modules/*" -type f \
            -exec sed -i "s|{{VITE_GM_WHITELIST}}|DRY_RUN_WHITELIST|g" {} \;
          echo "✓ No errors during variable substitution"

      - name: Verify output size
        run: |
          TOTAL=$(du -sh . --exclude=node_modules --exclude=.git 2>/dev/null | cut -f1)
          echo "Artifact size estimate: $TOTAL"
