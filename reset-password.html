<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>X-MEN TTRPG // NOVA SENHA</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/pwa-icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#080808">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cérebro">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://wlpdfrqzbpwuxyqeayjt.supabase.co" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Oswald:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Oswald:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Oswald:wght@400;600;700&display=swap"></noscript>
  <link rel="stylesheet" href="assets/css/base.css?v=dev">
  <link rel="stylesheet" href="assets/css/components.css?v=dev">
  <link rel="stylesheet" href="assets/css/auth.css?v=dev">
  <script src="assets/js/config.js?v=dev" defer></script>
  <script src="assets/js/i18n.js?v=dev" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="assets/js/supabase-client.js?v=dev" defer></script>
  <script src="assets/js/auth-module.js?v=dev" defer></script>
  <script src="assets/js/themes.js?v=dev" defer></script>
  <script src="assets/js/pwa.js?v=dev" defer></script>
  <link rel="stylesheet" href="assets/css/mobile.css?v=dev">
</head>
<body>

  <div class="auth-container">
    <div class="auth-logo">
      <svg viewBox="0 0 64 64" fill="none">
        <rect x="2" y="2" width="60" height="60" rx="3" stroke="var(--accent)" stroke-width="3"/>
        <rect x="8" y="8" width="48" height="48" rx="1" stroke="var(--accent)" stroke-width="1" opacity="0.3"/>
        <line x1="16" y1="16" x2="48" y2="48" stroke="var(--accent)" stroke-width="4.5"/>
        <line x1="48" y1="16" x2="16" y2="48" stroke="var(--accent)" stroke-width="4.5"/>
      </svg>
    </div>

    <h1 class="auth-title">XAVIER INSTITUTE</h1>
    <p class="auth-subtitle">Redefinir Senha</p>

    <div class="auth-card">
      <div id="auth-error" class="auth-error"></div>

      <form id="reset-form" class="auth-form active">
        <div class="form-group">
          <label class="form-label">Nova Senha</label>
          <input type="password" class="form-input" name="password" id="reset-password" required minlength="6">
          <div class="form-hint">Mínimo 6 caracteres</div>
          <div class="form-error" id="password-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirmar Senha</label>
          <input type="password" class="form-input" name="passwordConfirm" id="reset-password-confirm" required minlength="6">
          <div class="form-error" id="passwordConfirm-error"></div>
        </div>
        <button type="submit" class="btn btn-primary" id="reset-submit">Salvar nova senha</button>
      </form>
    </div>

    <p class="auth-footer">X-MEN // CITY OF MIST</p>
  </div>

  <script>
    var errorEl = document.getElementById('auth-error');
    var form = document.getElementById('reset-form');
    var btn = document.getElementById('reset-submit');

    function showFieldError(field, msg) {
      var errEl = document.getElementById(field + '-error');
      if (errEl) {
        errEl.textContent = msg;
        errEl.classList.add('show');
      }
    }

    function clearFieldErrors() {
      ['password', 'passwordConfirm'].forEach(function(id) {
        var errEl = document.getElementById(id + '-error');
        if (errEl) errEl.classList.remove('show');
      });
    }

    function disableForm() {
      form.querySelectorAll('input, button').forEach(function(el) { el.disabled = true; });
    }

    // Supabase v2 parses the recovery token from the URL hash and creates a session
    // automatically. Wait for it (via getSession + onAuthStateChange fallback) before
    // allowing the form to be used.
    window.addEventListener('load', function() {
      var resolved = false;

      function onSessionFound() {
        if (resolved) return;
        resolved = true;
      }

      setTimeout(function() {
        var client = window.getSupabaseClient();
        if (!client) return;

        client.auth.getSession().then(function(result) {
          if (result.data.session) {
            onSessionFound();
            return;
          }

          var sub = client.auth.onAuthStateChange(function(event) {
            if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') {
              onSessionFound();
            }
          });

          setTimeout(function() {
            if (sub && sub.data && sub.data.subscription) sub.data.subscription.unsubscribe();
            if (!resolved) {
              errorEl.innerHTML = 'Link inválido ou expirado. Solicite um novo link de recuperação. <a href="index.html" style="color:inherit;text-decoration:underline;">Voltar</a>';
              errorEl.classList.add('show');
              disableForm();
            }
          }, 3000);
        });
      }, 300);
    });

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      clearFieldErrors();
      errorEl.textContent = '';
      errorEl.classList.remove('show');

      var pw = document.getElementById('reset-password').value;
      var pwConfirm = document.getElementById('reset-password-confirm').value;
      var isValid = true;

      if (pw.length < 6) {
        showFieldError('password', 'SENHA MUITO CURTA');
        isValid = false;
      }
      if (pw !== pwConfirm) {
        showFieldError('passwordConfirm', 'SENHAS NÃO CONFEREM');
        isValid = false;
      }
      if (!isValid) return;

      var orig = btn.textContent;
      btn.textContent = 'Salvando...';
      btn.disabled = true;

      window.api.updatePassword(pw)
        .then(function() {
          errorEl.textContent = 'Senha alterada com sucesso!';
          errorEl.style.color = 'var(--accent)';
          errorEl.style.borderColor = 'var(--accent)';
          errorEl.classList.add('show');
          setTimeout(function() {
            window.location.href = 'dashboard.html';
          }, 1500);
        })
        .catch(function(err) {
          errorEl.textContent = err.message;
          errorEl.classList.add('show');
          btn.textContent = orig;
          btn.disabled = false;
        });
    });
  </script>
</body>
</html>
