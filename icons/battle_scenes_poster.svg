<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 780" width="960" height="1560">

<!-- Background -->
<rect width="480" height="780" fill="#0c0c0c"/>
<!-- Radial vignette -->
<radialGradient id="vig" cx="50%" cy="50%" r="70%">
  <stop offset="0%" stop-color="transparent"/>
  <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
</radialGradient>
<rect width="480" height="780" fill="url(#vig)"/>

<!-- subtle noise lines texture -->
<g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
  <line x1="0" y1="20" x2="480" y2="20"/>
  <line x1="0" y1="40" x2="480" y2="40"/>
  <line x1="0" y1="60" x2="480" y2="60"/>
  <line x1="0" y1="80" x2="480" y2="80"/>
  <line x1="0" y1="100" x2="480" y2="100"/>
  <line x1="0" y1="120" x2="480" y2="120"/>
  <line x1="0" y1="140" x2="480" y2="140"/>
  <line x1="0" y1="160" x2="480" y2="160"/>
  <line x1="0" y1="180" x2="480" y2="180"/>
  <line x1="0" y1="200" x2="480" y2="200"/>
  <line x1="0" y1="220" x2="480" y2="220"/>
  <line x1="0" y1="240" x2="480" y2="240"/>
  <line x1="0" y1="260" x2="480" y2="260"/>
  <line x1="0" y1="280" x2="480" y2="280"/>
  <line x1="0" y1="300" x2="480" y2="300"/>
  <line x1="0" y1="320" x2="480" y2="320"/>
  <line x1="0" y1="340" x2="480" y2="340"/>
  <line x1="0" y1="360" x2="480" y2="360"/>
  <line x1="0" y1="380" x2="480" y2="380"/>
  <line x1="0" y1="400" x2="480" y2="400"/>
  <line x1="0" y1="420" x2="480" y2="420"/>
  <line x1="0" y1="440" x2="480" y2="440"/>
  <line x1="0" y1="460" x2="480" y2="460"/>
  <line x1="0" y1="480" x2="480" y2="480"/>
  <line x1="0" y1="500" x2="480" y2="500"/>
  <line x1="0" y1="520" x2="480" y2="520"/>
  <line x1="0" y1="540" x2="480" y2="540"/>
  <line x1="0" y1="560" x2="480" y2="560"/>
  <line x1="0" y1="580" x2="480" y2="580"/>
  <line x1="0" y1="600" x2="480" y2="600"/>
  <line x1="0" y1="620" x2="480" y2="620"/>
  <line x1="0" y1="640" x2="480" y2="640"/>
  <line x1="0" y1="660" x2="480" y2="660"/>
  <line x1="0" y1="680" x2="480" y2="680"/>
  <line x1="0" y1="700" x2="480" y2="700"/>
  <line x1="0" y1="720" x2="480" y2="720"/>
  <line x1="0" y1="740" x2="480" y2="740"/>
  <line x1="0" y1="760" x2="480" y2="760"/>
</g>

<!-- ===== TOP TYPOGRAPHY ===== -->
<text x="240" y="54" text-anchor="middle"
  font-family="Impact, Arial Narrow, Arial, sans-serif"
  font-size="30" fill="white" letter-spacing="6">COM</text>

<text x="240" y="112" text-anchor="middle"
  font-family="Impact, Arial Narrow, Arial, sans-serif"
  font-size="72" font-style="italic" fill="white" letter-spacing="2">GRANDES</text>

<text x="240" y="185" text-anchor="middle"
  font-family="Impact, Arial Narrow, Arial, sans-serif"
  font-size="90" font-style="italic" fill="white" letter-spacing="0">PODERES</text>

<!-- Top rule -->
<rect x="36" y="197" width="408" height="1.5" fill="#3a3a3a"/>

<!-- ===== ICON GRID ===== -->
<!-- 3 columns: x=96, 240, 384 -->
<!-- 5 rows:    y=258, 344, 430, 516, 602 -->

<!-- === ROW 1 === -->

<!-- 1. LIGHTNING BOLT (Battle Scenes original) -->
<g transform="translate(96,258)">
  <circle r="35" fill="#181818" stroke="#3a3a3a" stroke-width="2"/>
  <polygon points="5,-22 -3,2 3,2 -6,22 16,0 8,0 18,-22" fill="white"/>
</g>

<!-- 2. SPIDER WEB (Battle Scenes original) -->
<g transform="translate(240,258)">
  <circle r="35" fill="#181818" stroke="#3a3a3a" stroke-width="2"/>
  <!-- radial lines -->
  <g stroke="white" stroke-width="1.6" stroke-linecap="round">
    <line x1="0" y1="-22" x2="0" y2="22"/>
    <line x1="-22" y1="0" x2="22" y2="0"/>
    <line x1="-15.6" y1="-15.6" x2="15.6" y2="15.6"/>
    <line x1="15.6" y1="-15.6" x2="-15.6" y2="15.6"/>
  </g>
  <!-- concentric rings -->
  <circle r="7" fill="none" stroke="white" stroke-width="1.6"/>
  <circle r="13" fill="none" stroke="white" stroke-width="1.4"/>
  <circle r="20" fill="none" stroke="white" stroke-width="1.2"/>
</g>

<!-- 3. GEAR (Battle Scenes original) -->
<g transform="translate(384,258)">
  <circle r="35" fill="#181818" stroke="#3a3a3a" stroke-width="2"/>
  <!-- gear polygon with teeth -->
  <polygon points="
    -4,-21 4,-21 6,-15 12,-18 17,-13 14,-7 20,-4 20,4 14,7 17,13 12,18 6,15 4,21 -4,21 -6,15 -12,18 -17,13 -14,7 -20,4 -20,-4 -14,-7 -17,-13 -12,-18 -6,-15
  " fill="white"/>
  <circle r="8" fill="#181818"/>
  <circle r="3" fill="white"/>
</g>

<!-- === ROW 2 === -->

<!-- 4. EYE (Battle Scenes original) -->
<g transform="translate(96,344)">
  <circle r="35" fill="#181818" stroke="#3a3a3a" stroke-width="2"/>
  <path d="M-21,0 C-12,-14 12,-14 21,0 C12,14 -12,14 -21,0 Z" fill="white"/>
  <circle r="7" fill="#181818"/>
  <circle r="4" fill="white"/>
  <circle cx="2" cy="-1" r="1.5" fill="#181818"/>
</g>

<!-- 5. THREE SLASHES / CLAWS (Battle Scenes original) -->
<g transform="translate(240,344)">
  <circle r="35" fill="#181818" stroke="#3a3a3a" stroke-width="2"/>
  <g stroke="white" stroke-width="3.5" stroke-linecap="round">
    <line x1="-10" y1="-20" x2="-10" y2="20"/>
    <line x1="0" y1="-20" x2="0" y2="20"/>
    <line x1="10" y1="-20" x2="10" y2="20"/>
  </g>
</g>

<!-- 6. DOUBLE ARROW / MOVEMENT (Battle Scenes original) -->
<g transform="translate(384,344)">
  <circle r="35" fill="#181818" stroke="#3a3a3a" stroke-width="2"/>
  <g fill="white">
    <!-- arrow 1 -->
    <rect x="-20" y="-12" width="22" height="5" rx="2"/>
    <polygon points="4,-15 12,-9.5 4,-4"/>
    <!-- arrow 2 -->
    <rect x="-5" y="7" width="22" height="5" rx="2"/>
    <polygon points="19,4 27,9.5 19,15"/>
  </g>
</g>

<!-- === ROW 3 === -->

<!-- 7. STARBURST (Battle Scenes original) -->
<g transform="translate(96,430)">
  <circle r="35" fill="#181818" stroke="#3a3a3a" stroke-width="2"/>
  <g fill="white">
    <!-- 8-pointed starburst -->
    <polygon points="0,-22 3,-6 14,-14 6,-3 22,0 6,3 14,14 3,6 0,22 -3,6 -14,14 -6,3 -22,0 -6,-3 -14,-14 -3,-6"/>
    <circle r="5" fill="#181818"/>
    <circle r="2.5" fill="white"/>
  </g>
</g>

<!-- 8. SKULL (Battle Scenes original) -->
<g transform="translate(240,430)">
  <circle r="35" fill="#181818" stroke="#3a3a3a" stroke-width="2"/>
  <g fill="white">
    <!-- skull cranium -->
    <path d="M-13,-19 Q-20,-19 -20,-9 L-20,5 Q-20,11 -14,13 L-14,20 L14,20 L14,13 Q20,11 20,5 L20,-9 Q20,-19 13,-19 Z"/>
    <!-- eye sockets -->
    <rect x="-15" y="-11" width="10" height="10" rx="3" fill="#181818"/>
    <rect x="5" y="-11" width="10" height="10" rx="3" fill="#181818"/>
    <!-- nose -->
    <rect x="-2.5" y="0" width="5" height="6" rx="1.5" fill="#181818"/>
    <!-- teeth -->
    <rect x="-12" y="13" width="4" height="7" rx="1" fill="#181818"/>
    <rect x="-4" y="13" width="4" height="7" rx="1" fill="#181818"/>
    <rect x="4" y="13" width="4" height="7" rx="1" fill="#181818"/>
  </g>
</g>

<!-- 9. FIST (Battle Scenes original) -->
<g transform="translate(384,430)">
  <circle r="35" fill="#181818" stroke="#3a3a3a" stroke-width="2"/>
  <g fill="white">
    <!-- palm -->
    <rect x="-15" y="-4" width="30" height="20" rx="4"/>
    <!-- knuckles row -->
    <rect x="-15" y="-16" width="8" height="14" rx="3"/>
    <rect x="-5" y="-18" width="8" height="16" rx="3"/>
    <rect x="5" y="-17" width="8" height="15" rx="3"/>
    <!-- pinky -->
    <rect x="15" y="-12" width="6" height="10" rx="3"/>
    <!-- thumb -->
    <path d="M-22,-4 Q-26,2 -22,8 L-15,8 L-15,-4 Z" rx="3"/>
  </g>
</g>

<!-- === ROW 4 === -->

<!-- 10. WING / DOVE (Battle Scenes original) -->
<g transform="translate(96,516)">
  <circle r="35" fill="#181818" stroke="#3a3a3a" stroke-width="2"/>
  <g fill="white">
    <path d="M0,8 C-6,0 -20,-18 -24,-10 C-22,-4 -14,4 0,8 Z"/>
    <path d="M0,8 C6,0 20,-18 24,-10 C22,-4 14,4 0,8 Z"/>
    <path d="M-16,-2 Q-10,-14 0,-12 Q10,-14 16,-2 Q8,2 0,8 Q-8,2 -16,-2 Z"/>
    <!-- body -->
    <ellipse cx="0" cy="14" rx="5" ry="8"/>
    <!-- head -->
    <circle cx="0" cy="4" r="4"/>
  </g>
</g>

<!-- 11. PILL / CAPSULE (Battle Scenes original) -->
<g transform="translate(240,516)">
  <circle r="35" fill="#181818" stroke="#3a3a3a" stroke-width="2"/>
  <g transform="rotate(-40)">
    <rect x="-20" y="-9" width="40" height="18" rx="9" fill="white"/>
    <rect x="-1" y="-9" width="2" height="18" fill="#181818"/>
    <!-- stripes on right half -->
    <rect x="5" y="-9" width="14" height="18" rx="0" fill="#181818" opacity="0.6"/>
    <rect x="5" y="-9" width="14" height="18" rx="0" fill="none"/>
  </g>
  <!-- redraw clean -->
  <g transform="rotate(-40)">
    <path d="M9,-9 Q20,-9 20,0 Q20,9 9,9 L1,9 L1,-9 Z" fill="white"/>
    <path d="M-9,-9 L1,-9 L1,9 L-9,9 Q-20,9 -20,0 Q-20,-9 -9,-9 Z" fill="white"/>
    <rect x="0" y="-9" width="1.5" height="18" fill="#181818"/>
  </g>
</g>

<!-- 12. ORB / SPHERE (Battle Scenes original) -->
<g transform="translate(384,516)">
  <circle r="35" fill="#181818" stroke="#3a3a3a" stroke-width="2"/>
  <g fill="none" stroke="white">
    <circle r="19" stroke-width="2"/>
    <!-- latitude lines -->
    <ellipse rx="19" ry="6.5" stroke-width="1.4"/>
    <ellipse rx="13" ry="19" stroke-width="1.4"/>
    <!-- axis -->
    <line x1="0" y1="-19" x2="0" y2="19" stroke-width="1.2"/>
    <line x1="-19" y1="0" x2="19" y2="0" stroke-width="1.2"/>
  </g>
</g>

<!-- === ROW 5 === -->

<!-- 13. MICROPHONE (Battle Scenes original) -->
<g transform="translate(96,602)">
  <circle r="35" fill="#181818" stroke="#3a3a3a" stroke-width="2"/>
  <g fill="none" stroke="white" stroke-linecap="round">
    <!-- mic body -->
    <rect x="-7" y="-20" width="14" height="18" rx="7" stroke-width="2.2" fill="none"/>
    <!-- stand -->
    <path d="M-13,-5 C-13,10 13,10 13,-5" stroke-width="2"/>
    <line x1="0" y1="10" x2="0" y2="20" stroke-width="2"/>
    <line x1="-9" y1="20" x2="9" y2="20" stroke-width="2"/>
  </g>
</g>

<!-- 14. DIAMOND STAR (Battle Scenes original) -->
<g transform="translate(240,602)">
  <circle r="35" fill="#181818" stroke="#3a3a3a" stroke-width="2"/>
  <g fill="white">
    <polygon points="0,-22 5,-5 22,0 5,5 0,22 -5,5 -22,0 -5,-5"/>
    <polygon points="0,-13 3,-3 13,0 3,3 0,13 -3,3 -13,0 -3,-3" fill="#181818"/>
    <polygon points="0,-6 1.5,-1.5 6,0 1.5,1.5 0,6 -1.5,1.5 -6,0 -1.5,-1.5" fill="white"/>
  </g>
</g>

<!-- 15. SHIELD (NEW) -->
<g transform="translate(384,602)">
  <circle r="35" fill="#181818" stroke="#3a3a3a" stroke-width="2"/>
  <g fill="none" stroke="white" stroke-linejoin="round">
    <path d="M0,-22 L18,-14 L18,0 Q18,17 0,24 Q-18,17 -18,0 L-18,-14 Z" stroke-width="2.2" fill="white"/>
    <path d="M0,-22 L18,-14 L18,0 Q18,17 0,24 Q-18,17 -18,0 L-18,-14 Z" stroke-width="2.2" fill="none" stroke="#181818"/>
    <path d="M0,-22 L18,-14 L18,0 Q18,17 0,24 Q-18,17 -18,0 L-18,-14 Z" stroke-width="2.2"/>
    <!-- checkmark -->
    <path d="M-8,0 L-2,8 L10,-8" stroke-width="2.8" stroke-linecap="round" fill="none" stroke="#181818"/>
  </g>
  <!-- redo: filled shield with cut-out check -->
  <path d="M0,-22 L18,-14 L18,0 Q18,17 0,24 Q-18,17 -18,0 L-18,-14 Z" fill="white"/>
  <path d="M-8,0 L-2,8 L10,-8" stroke="#181818" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</g>

<!-- Bottom rule -->
<rect x="36" y="648" width="408" height="1.5" fill="#3a3a3a"/>

<!-- ===== BOTTOM TYPOGRAPHY ===== -->
<text x="240" y="675" text-anchor="middle"
  font-family="Impact, Arial Narrow, Arial, sans-serif"
  font-size="30" fill="white" letter-spacing="6">VÊM</text>

<text x="240" y="728" text-anchor="middle"
  font-family="Impact, Arial Narrow, Arial, sans-serif"
  font-size="72" font-style="italic" fill="white" letter-spacing="2">GRANDES</text>

<text x="240" y="773" text-anchor="middle"
  font-family="Impact, Arial Narrow, Arial, sans-serif"
  font-size="40" font-style="italic" fill="white" letter-spacing="0">RESPONSABILIDADES</text>

</svg>