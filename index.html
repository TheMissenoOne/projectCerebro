<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>X-MEN TTRPG // LOGIN</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/pwa-icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#080808">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cérebro">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://wlpdfrqzbpwuxyqeayjt.supabase.co" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Oswald:wght@400;600;700&family=Saira+Stencil+One&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Oswald:wght@400;600;700&family=Saira+Stencil+One&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Oswald:wght@400;600;700&family=Saira+Stencil+One&display=swap"></noscript>
  <link rel="stylesheet" href="assets/css/base.css?v=dev">
  <link rel="stylesheet" href="assets/css/components.css?v=dev">
  <link rel="stylesheet" href="assets/css/auth.css?v=dev">
  <script src="assets/js/config.js?v=dev" defer></script>
  <script src="assets/js/i18n.js?v=dev" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="assets/js/supabase-client.js?v=dev" defer></script>
  <script src="assets/js/auth-module.js?v=dev" defer></script>
  <script src="assets/js/themes.js?v=dev" defer></script>
  <script src="assets/js/pwa.js?v=dev" defer></script>
  <link rel="stylesheet" href="assets/css/mobile.css?v=dev">
</head>
<body class="auth-page">

  <button type="button" class="btn btn-sm auth-lang" id="auth-lang">EN</button>

  <!-- .auth-container: unstyled marker, tests/spa-e2e.test.js looks for it -->
  <main class="auth-shell auth-container">
    <header class="auth-brand">
      <svg class="auth-logo" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <rect x="2" y="2" width="60" height="60" rx="3" stroke="var(--accent)" stroke-width="3"/>
        <rect x="8" y="8" width="48" height="48" rx="1" stroke="var(--accent)" stroke-width="1" opacity="0.3"/>
        <line x1="16" y1="16" x2="48" y2="48" stroke="var(--accent)" stroke-width="4.5"/>
        <line x1="48" y1="16" x2="16" y2="48" stroke="var(--accent)" stroke-width="4.5"/>
      </svg>
      <div class="auth-brand-txt">
        <p class="dwl auth-eyebrow" data-i18n="auth.eyebrow">XAVIER INSTITUTE // SIGILOSO</p>
        <h1 class="auth-title stencil stencil-fx" data-i18n="auth.title">Cérebro</h1>
        <p class="auth-subtitle" data-i18n="auth.subtitle">Terminal de acesso restrito</p>
      </div>
    </header>

    <section class="dossier auth-card" id="auth-card" data-mode="login" aria-labelledby="tab-login">
      <div class="tabs auth-tabs" role="tablist" data-i18n-aria-label="auth.tabsLabel" aria-label="Acesso">
        <button type="button" class="tab auth-tab active" role="tab" id="tab-login" data-tab="login" aria-selected="true" aria-controls="login-form" data-i18n="auth.tab.login">Entrar</button>
        <button type="button" class="tab auth-tab" role="tab" id="tab-register" data-tab="register" aria-selected="false" aria-controls="register-form" tabindex="-1" data-i18n="auth.tab.register">Cadastrar</button>
      </div>
      <header class="dossier-hd auth-recover-hd">
        <h2 class="dossier-title stencil" id="recover-title" tabindex="-1" data-i18n="auth.recover.title">Recuperar acesso</h2>
        <span class="dossier-meta">AUTH-02</span>
      </header>

      <div class="dossier-body auth-body">
        <div id="auth-error" class="alert alert-error" role="alert" hidden></div>
        <div id="auth-status" class="alert alert-success" role="status" aria-live="polite" hidden></div>

        <form id="login-form" class="auth-form active" role="tabpanel" aria-labelledby="tab-login" novalidate>
          <div class="form-group">
            <label class="form-label" for="login-email" data-i18n="auth.field.email">Email</label>
            <input class="form-input" id="login-email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" required aria-describedby="login-email-err" data-i18n-placeholder="auth.ph.email" placeholder="voce@exemplo.com">
            <div class="form-error" id="login-email-err"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password" data-i18n="auth.field.password">Senha</label>
            <div class="pw-field">
              <input class="form-input" id="login-password" name="password" type="password" autocomplete="current-password" required aria-describedby="login-password-err login-password-caps">
              <button type="button" class="pw-toggle" aria-controls="login-password" data-i18n-aria-label="auth.pw.showLabel" aria-label="Mostrar senha"><span data-i18n="auth.pw.show">Mostrar</span></button>
            </div>
            <div class="form-hint caps-hint" id="login-password-caps" hidden data-i18n="auth.hint.capsLock">Caps Lock ativado</div>
            <div class="form-error" id="login-password-err"></div>
          </div>
          <button type="submit" class="btn btn-primary auth-submit" data-busy="auth.btn.loginBusy" data-i18n="auth.btn.login">Acessar</button>
          <button type="button" class="btn btn-ghost auth-link" id="forgot-password-link" data-mode-to="forgot" data-i18n="auth.btn.forgot">Esqueci minha senha</button>
        </form>

        <form id="recover-form" class="auth-form" aria-labelledby="recover-title" novalidate>
          <p class="auth-lead" data-i18n="auth.recover.lead">Informe o email da conta. Enviaremos um link para criar uma nova senha.</p>
          <div class="form-group">
            <label class="form-label" for="recover-email" data-i18n="auth.field.email">Email</label>
            <input class="form-input" id="recover-email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" required aria-describedby="recover-email-err" data-i18n-placeholder="auth.ph.email" placeholder="voce@exemplo.com">
            <div class="form-error" id="recover-email-err"></div>
          </div>
          <button type="submit" class="btn btn-primary auth-submit" data-busy="auth.btn.recoverBusy" data-i18n="auth.btn.recover">Enviar link</button>
          <button type="button" class="btn btn-ghost auth-link" id="back-to-login-link" data-mode-to="login" data-i18n="auth.btn.back">Voltar ao login</button>
        </form>

        <form id="register-form" class="auth-form" role="tabpanel" aria-labelledby="tab-register" novalidate>
          <div class="form-group">
            <label class="form-label" for="reg-email" data-i18n="auth.field.email">Email</label>
            <input class="form-input" id="reg-email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" required aria-describedby="reg-email-err" data-i18n-placeholder="auth.ph.email" placeholder="voce@exemplo.com">
            <div class="form-error" id="reg-email-err"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-password" data-i18n="auth.field.password">Senha</label>
            <div class="pw-field">
              <input class="form-input" id="reg-password" name="password" type="password" autocomplete="new-password" required minlength="6" aria-describedby="reg-password-hint reg-password-err reg-password-caps">
              <button type="button" class="pw-toggle" aria-controls="reg-password" data-i18n-aria-label="auth.pw.showLabel" aria-label="Mostrar senha"><span data-i18n="auth.pw.show">Mostrar</span></button>
            </div>
            <div class="form-hint" id="reg-password-hint" data-i18n="auth.hint.passwordMin" data-ok="auth.hint.passwordOk">Mínimo 6 caracteres</div>
            <div class="form-hint caps-hint" id="reg-password-caps" hidden data-i18n="auth.hint.capsLock">Caps Lock ativado</div>
            <div class="form-error" id="reg-password-err"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-username" data-i18n="auth.field.username">Usuário</label>
            <input class="form-input" id="reg-username" name="username" type="text" autocomplete="nickname" autocapitalize="none" spellcheck="false" required aria-describedby="reg-username-err">
            <div class="form-error" id="reg-username-err"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-displayName" data-i18n="auth.field.displayName">Nome de exibição</label>
            <input class="form-input" id="reg-displayName" name="displayName" type="text" autocomplete="name" required aria-describedby="reg-displayName-hint reg-displayName-err">
            <div class="form-hint" id="reg-displayName-hint" data-i18n="auth.hint.displayName">Aparece para o grupo e o mestre</div>
            <div class="form-error" id="reg-displayName-err"></div>
          </div>
          <input type="hidden" name="role" value="player">
          <button type="submit" class="btn btn-primary auth-submit" id="reg-submit" data-busy="auth.btn.registerBusy" data-i18n="auth.btn.register">Criar conta</button>
        </form>
      </div>
    </section>

    <p class="auth-footer">X-MEN // CITY OF MIST</p>
  </main>

  <script>
    // Redirect if already logged in - wait for fully loaded
    window.addEventListener('load', function() {
      setTimeout(function() {
        window.checkAuth();
      }, 100);
    });

    // deferred scripts (i18n, auth-module) have run by DOMContentLoaded
    document.addEventListener('DOMContentLoaded', function() {
      initLanguage();
      applyTranslations();
      document.title = t('auth.docTitle.login');

      var ui = window.authUI;
      var $ = function(id) { return document.getElementById(id); };
      var card = $('auth-card');
      var FORMS = { login: $('login-form'), register: $('register-form'), forgot: $('recover-form') };
      var mode = 'login';
      var EMAIL_KEY = 'cerebro_auth_email';
      var hasMouse = matchMedia('(pointer: fine)').matches;

      function firstEmpty(form) {
        var ins = form.querySelectorAll('.form-input');
        for (var i = 0; i < ins.length; i++) if (!ins[i].value) return ins[i];
        return ins[0];
      }

      // login ⇄ register ⇄ forgot; the typed email follows the user, the mode lives in the hash (#register / #forgot)
      function setMode(next, focus) {
        var email = FORMS[mode].elements.email.value;
        mode = next;
        card.dataset.mode = next;
        Object.keys(FORMS).forEach(function(k) { FORMS[k].classList.toggle('active', k === next); });
        document.querySelectorAll('.auth-tab').forEach(function(tab) {
          var on = tab.dataset.tab === (next === 'register' ? 'register' : 'login');
          tab.classList.toggle('active', on);
          tab.setAttribute('aria-selected', on);
          tab.tabIndex = on ? 0 : -1;
        });
        card.setAttribute('aria-labelledby', next === 'forgot' ? 'recover-title' : 'tab-' + (next === 'register' ? 'register' : 'login'));
        if (email) FORMS[next].elements.email.value = email;
        ui.say();
        history.replaceState(null, '', location.pathname + location.search + (next === 'login' ? '' : '#' + next));
        if (focus) (next === 'forgot' && !email ? FORMS.forgot.elements.email : firstEmpty(FORMS[next])).focus();
      }

      document.querySelectorAll('.auth-tab').forEach(function(tab) {
        tab.addEventListener('click', function() { if (tab.getAttribute('aria-selected') !== 'true' || mode === 'forgot') setMode(tab.dataset.tab, true); });
        tab.addEventListener('keydown', function(e) {
          if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
          var other = document.querySelector('.auth-tab:not([data-tab="' + tab.dataset.tab + '"])');
          other.focus();
          other.click();
        });
      });
      document.querySelectorAll('[data-mode-to]').forEach(function(b) {
        b.addEventListener('click', function() { setMode(b.dataset.modeTo, true); });
      });

      ui.wirePasswords(document);
      ui.lang($('auth-lang'), function() {
        try { sessionStorage.setItem(EMAIL_KEY, FORMS[mode].elements.email.value); } catch (e) {}
      });

      function fail(err, fieldMap) {
        var key = window.authErrorKey(err);
        console.warn('[auth]', err);
        var field = fieldMap && fieldMap[key];
        if (field) { ui.fieldError(field, key); field.focus(); return; }
        ui.say('error', t(key));
      }

      ui.onSubmit(FORMS.login, function() {
        var f = FORMS.login;
        return window.api.login(f.email.value.trim(), f.password.value)
          .then(function() {
            // Wait for session to persist before redirecting
            return window.getSupabaseInternal().auth.getSession();
          })
          .then(function() {
            window.location.href = 'dashboard.html';
            return true;
          })
          .catch(function(err) {
            fail(err);
            if (window.authErrorKey(err) === 'auth.err.credentials') { f.password.focus(); f.password.select(); }
          });
      });

      ui.onSubmit(FORMS.forgot, function() {
        return window.api.requestPasswordReset(FORMS.forgot.email.value.trim())
          .then(function() { ui.say('success', t('auth.msg.recoverSent')); })
          .catch(function(err) { fail(err, { 'auth.err.email': FORMS.forgot.email }); });
      });

      ui.onSubmit(FORMS.register, function() {
        var f = FORMS.register;
        var email = f.email.value.trim();
        return window.api.register(email, f.password.value, f.username.value.trim(), f.displayName.value.trim(), 'player')
          .then(function(result) {
            if (result.session) {
              window.location.href = 'dashboard.html';
              return true;
            }
            // with email confirmation on, Supabase answers an already-registered email with a user that has no identities
            if (result.user && Array.isArray(result.user.identities) && result.user.identities.length === 0) {
              ui.fieldError(f.email, 'auth.err.exists');
              f.email.focus();
              return;
            }
            // Email confirmation required - no session yet
            f.password.value = '';
            setMode('login', false);
            ui.say('success', t('auth.msg.registered').replace('{email}', email));
            FORMS.login.password.focus();
          })
          .catch(function(err) {
            fail(err, { 'auth.err.exists': f.email, 'auth.err.email': f.email, 'auth.err.weak': f.password });
          });
      });

      // restore after a language switch (reload) and honour #register / #forgot links
      var saved = '';
      try { saved = sessionStorage.getItem(EMAIL_KEY) || ''; sessionStorage.removeItem(EMAIL_KEY); } catch (e) {}
      if (saved) FORMS.login.email.value = saved;
      var start = location.hash.slice(1);
      setMode(Object.prototype.hasOwnProperty.call(FORMS, start) ? start : 'login', false); // own-prop: #constructor must not match
      if (hasMouse) firstEmpty(FORMS[mode]).focus();
    });
  </script>
</body>
</html>
