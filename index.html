<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X-MEN TTRPG // ACESSO RESTRITO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: 
        linear-gradient(180deg, rgba(var(--accentRGB), 0.03) 0%, transparent 50%),
        var(--black);
    }

    .auth-logo {
      width: 120px;
      height: 120px;
      margin-bottom: 30px;
      animation: logoIn .6s ease both;
    }
    .auth-logo svg {
      width: 100%;
      height: 100%;
    }
    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .auth-title {
      font-family: var(--disp);
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      color: var(--white);
      letter-spacing: .25em;
      text-align: center;
      margin-bottom: 6px;
      animation: fadeUp .5s ease .2s both;
    }

    .auth-subtitle {
      font-family: var(--mono);
      font-size: .52rem;
      color: var(--muted);
      letter-spacing: .3em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 40px;
      animation: fadeUp .5s ease .3s both;
    }

    .auth-card {
      width: 100%;
      max-width: 340px;
      background: var(--p1);
      border: 1px solid var(--b1);
      padding: 24px;
      animation: fadeUp .5s ease .4s both;
    }

    .auth-tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--b1);
    }

    .auth-tab {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      font-family: var(--cond);
      font-size: .65rem;
      font-weight: 600;
      letter-spacing: .15em;
      color: var(--muted);
      cursor: pointer;
      text-transform: uppercase;
      transition: color .2s;
      position: relative;
    }
    .auth-tab::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--red);
      transform: scaleX(0);
      transition: transform .2s;
    }
    .auth-tab.active {
      color: var(--white);
    }
    .auth-tab.active::after {
      transform: scaleX(1);
    }

    .auth-form {
      display: none;
    }
    .auth-form.active {
      display: block;
    }

    .auth-form .form-group {
      margin-bottom: 16px;
    }

    .auth-form .form-label {
      font-family: var(--mono);
      font-size: .5rem;
      color: var(--muted);
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }

    .auth-form .form-input {
      width: 100%;
      padding: 10px 12px;
      background: var(--p2);
      border: 1px solid var(--b2);
      color: var(--white);
      font-family: var(--body);
      font-size: .9rem;
      outline: none;
      transition: border-color .15s;
    }
    .auth-form .form-input:focus {
      border-color: var(--red);
    }
    .auth-form .form-input::placeholder {
      color: var(--b3);
    }

    .auth-form .role-select {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .auth-form .role-btn {
      flex: 1;
      padding: 10px 12px;
      background: var(--p2);
      border: 1px solid var(--b2);
      color: var(--muted);
      font-family: var(--body);
      font-size: .6rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .15s;
    }
    .auth-form .role-btn:hover {
      border-color: var(--b3);
      color: var(--text);
    }
    .auth-form .role-btn.selected {
      border-color: var(--red);
      background: var(--red);
      color: var(--white);
    }

    .auth-form .btn {
      width: 100%;
      margin-top: 10px;
    }

    .auth-error {
      background: rgba(232,0,28,.1);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 10px 12px;
      margin-bottom: 16px;
      font-family: var(--mono);
      font-size: .5rem;
      letter-spacing: .05em;
      display: none;
    }
    .auth-error.show {
      display: block;
    }

    .auth-footer {
      margin-top: 20px;
      text-align: center;
      font-family: var(--mono);
      font-size: .42rem;
      color: var(--muted2);
      letter-spacing: .1em;
      animation: fadeUp .5s ease .5s both;
    }
</style>
</head>
<body>
<script>
(function(){
  var t = localStorage.getItem('cerebro_tema');
  if (t) document.body.className = 'theme-' + t;
})();
</script>
<div class="auth-container">
    <div class="auth-logo">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="60" height="60" rx="3" stroke="var(--accent)" stroke-width="3"/>
        <rect x="8" y="8" width="48" height="48" rx="1" stroke="var(--accent)" stroke-width="1" opacity="0.3"/>
        <line x1="16" y1="16" x2="48" y2="48" stroke="var(--accent)" stroke-width="4.5" stroke-linecap="square"/>
        <line x1="48" y1="16" x2="16" y2="48" stroke="var(--accent)" stroke-width="4.5" stroke-linecap="square"/>
        <rect class="logo-ext" x="27" y="3" width="10" height="3.5" fill="var(--accent)" opacity="0.6"/>
        <rect class="logo-ext" x="27" y="57.5" width="10" height="3.5" fill="var(--accent)" opacity="0.6"/>
        <rect class="logo-ext" x="3" y="27" width="3.5" height="10" fill="var(--accent)" opacity="0.6"/>
        <rect class="logo-ext" x="57.5" y="27" width="3.5" height="10" fill="var(--accent)" opacity="0.6"/>
      </svg>
    </div>
    
    <h1 class="auth-title">XAVIER INSTITUTE</h1>
    <p class="auth-subtitle">Acesso Restrito</p>
    
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Entrar</button>
        <button class="auth-tab" data-tab="register">Cadastrar</button>
      </div>
      
      <div id="error" class="auth-error"></div>
      
      <form id="login-form" class="auth-form active">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" name="email" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label class="form-label">Senha</label>
          <input type="password" class="form-input" name="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary">Acessar</button>
      </form>
      
      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" name="email" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label class="form-label">Senha</label>
          <input type="password" class="form-input" name="password" required minlength="6" placeholder="Mín. 6 caracteres">
        </div>
        <div class="form-group">
          <label class="form-label">Nome de Usuário</label>
          <input type="text" class="form-input" name="username" required placeholder="Usuario" pattern="[a-zA-Z0-9_]+">
        </div>
        <div class="form-group">
          <label class="form-label">Nome de Exibição</label>
          <input type="text" class="form-input" name="displayName" required placeholder="Seu Nome">
        </div>
        <div class="form-group">
          <label class="form-label">Perfil</label>
          <div class="role-select">
            <button type="button" class="role-btn selected" data-role="player">Jogador</button>
            <button type="button" class="role-btn" data-role="gm">Mestre</button>
          </div>
          <input type="hidden" name="role" value="player">
        </div>
        <button type="submit" class="btn btn-primary">Criar Conta</button>
      </form>
    </div>
    
    <p class="auth-footer">X-MEN // CITY OF MIST</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/themes.js"></script>
  <script>
    checkAuth();

    var tabs = document.querySelectorAll('.auth-tab');
    var forms = document.querySelectorAll('.auth-form');
    var errorEl = document.getElementById('error');

    tabs.forEach(function(tab) {
      tab.addEventListener('click', function() {
        tabs.forEach(function(t) { t.classList.remove('active'); });
        tab.classList.add('active');
        forms.forEach(function(f) { f.classList.remove('active'); });
        document.getElementById(tab.dataset.tab + '-form').classList.add('active');
        errorEl.classList.remove('show');
      });
    });

    var roleBtns = document.querySelectorAll('.role-btn');
    var roleInput = document.querySelector('input[name="role"]');
    roleBtns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        roleBtns.forEach(function(b) { b.classList.remove('selected'); });
        btn.classList.add('selected');
        roleInput.value = btn.dataset.role;
      });
    });

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var email = e.target.email.value;
      var password = e.target.password.value;
      var btn = e.target.querySelector('button[type="submit"]');
      var origText = btn.textContent;
      btn.textContent = 'Entrando...';
      btn.disabled = true;
      
      login(email, password).then(function() {
        window.location.href = 'dashboard.html';
      }).catch(function(err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('show');
        btn.textContent = origText;
        btn.disabled = false;
      });
    });

    document.getElementById('register-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var email = e.target.email.value;
      var password = e.target.password.value;
      var username = e.target.username.value;
      var displayName = e.target.displayName.value;
      var role = e.target.role.value;
      var btn = e.target.querySelector('button[type="submit"]');
      var origText = btn.textContent;
      btn.textContent = 'Criando...';
      btn.disabled = true;
      
      register(email, password, username, displayName, role).then(function() {
        window.location.href = 'dashboard.html';
      }).catch(function(err) {
        console.error('Erro:', err);
        errorEl.textContent = err.message || 'Erro ao criar conta';
        errorEl.classList.add('show');
        btn.textContent = origText;
        btn.disabled = false;
      });
    });
    
    initTheme();
  </script>
</body>
</html>
