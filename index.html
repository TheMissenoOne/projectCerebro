<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>X-MEN TTRPG // LOGIN</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/pwa-icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#080808">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cérebro">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://wlpdfrqzbpwuxyqeayjt.supabase.co" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Oswald:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Oswald:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Oswald:wght@400;600;700&display=swap"></noscript>
  <link rel="stylesheet" href="assets/css/base.css?v=dev">
  <link rel="stylesheet" href="assets/css/components.css?v=dev">
  <link rel="stylesheet" href="assets/css/auth.css?v=dev">
  <script src="assets/js/config.js?v=dev" defer></script>
  <script src="assets/js/i18n.js?v=dev" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="assets/js/supabase-client.js?v=dev" defer></script>
  <script src="assets/js/auth-module.js?v=dev" defer></script>
  <script src="assets/js/themes.js?v=dev" defer></script>
  <script src="assets/js/pwa.js?v=dev" defer></script>
  <link rel="stylesheet" href="assets/css/mobile.css?v=dev">
</head>
<body>

  <div class="auth-container">
    <div class="auth-logo">
      <svg viewBox="0 0 64 64" fill="none">
        <rect x="2" y="2" width="60" height="60" rx="3" stroke="var(--accent)" stroke-width="3"/>
        <rect x="8" y="8" width="48" height="48" rx="1" stroke="var(--accent)" stroke-width="1" opacity="0.3"/>
        <line x1="16" y1="16" x2="48" y2="48" stroke="var(--accent)" stroke-width="4.5"/>
        <line x1="48" y1="16" x2="16" y2="48" stroke="var(--accent)" stroke-width="4.5"/>
      </svg>
    </div>

    <h1 class="auth-title">XAVIER INSTITUTE</h1>
    <p class="auth-subtitle">Acesso Restrito</p>

    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Entrar</button>
        <button class="auth-tab" data-tab="register">Cadastrar</button>
      </div>

      <div id="auth-error" class="auth-error"></div>

      <form id="login-form" class="auth-form active">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" name="email" required>
        </div>
        <div class="form-group">
          <label class="form-label">Senha</label>
          <input type="password" class="form-input" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary">Acessar</button>
      </form>

      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" name="email" id="reg-email" required>
          <div class="form-error" id="email-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Senha</label>
          <input type="password" class="form-input" name="password" id="reg-password" required minlength="6">
          <div class="form-hint" id="password-hint">Mínimo 6 caracteres</div>
          <div class="form-error" id="password-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Usuário</label>
          <input type="text" class="form-input" name="username" id="reg-username" required>
          <div class="form-error" id="username-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Nome de Exibição</label>
          <input type="text" class="form-input" name="displayName" id="reg-displayName" required>
          <div class="form-error" id="displayName-error"></div>
        </div>
        <input type="hidden" name="role" value="player">
        <button type="submit" class="btn btn-primary" id="reg-submit">Criar Conta</button>
      </form>
    </div>

    <p class="auth-footer">X-MEN // CITY OF MIST</p>
  </div>

  <script>
    // Redirect if already logged in - wait for fully loaded
    window.addEventListener('load', function() {
      setTimeout(function() {
        window.checkAuth();
      }, 100);
    });

    var errorEl = document.getElementById('auth-error');

    // Tab switching
    document.querySelectorAll('.auth-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.auth-tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelectorAll('.auth-form').forEach(function(f) { f.classList.remove('active'); });
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab + '-form').classList.add('active');
        errorEl.textContent = '';
        errorEl.classList.remove('show');
      });
    });

    // Login form
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = e.target.querySelector('button[type="submit"]');
      var orig = btn.textContent;
      btn.textContent = 'Entrando...';
      btn.disabled = true;
      window.api.login(e.target.email.value, e.target.password.value)
        .then(function() {
          // Wait for session to persist before redirecting
          var client = window.getSupabaseInternal();
          return client.auth.getSession();
        })
        .then(function() {
          window.location.href = 'dashboard.html';
        })
        .catch(function(err) {
          errorEl.textContent = err.message;
          errorEl.classList.add('show');
          btn.textContent = orig;
          btn.disabled = false;
        });
    });

    // Register form
    document.getElementById('register-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Validate before submit
      var isValid = true;
      var password = document.getElementById('reg-password');
      var email = document.getElementById('reg-email');
      var username = document.getElementById('reg-username');
      var displayName = document.getElementById('reg-displayName');
      
      if (password.value.length < 6) {
        showFieldError('password', 'SENHA MUITO CURTA');
        password.classList.add('validate-error');
        isValid = false;
      }
      if (!email.value || !email.validity.valid) {
        showFieldError('email', 'EMAIL INVÁLIDO');
        email.classList.add('validate-error');
        isValid = false;
      }
      if (!username.value.trim()) {
        showFieldError('username', 'USUÁRIO OBRIGATÓRIO');
        username.classList.add('validate-error');
        isValid = false;
      }
      if (!displayName.value.trim()) {
        showFieldError('displayName', 'NOME OBRIGATÓRIO');
        displayName.classList.add('validate-error');
        isValid = false;
      }
      
      if (!isValid) return;
      
      var btn = e.target.querySelector('button[type="submit"]');
      var orig = btn.textContent;
      btn.textContent = 'Criando...';
      btn.disabled = true;
      window.api.register(
        e.target.email.value,
        e.target.password.value,
        e.target.username.value,
        e.target.displayName.value,
        'player'
      )
        .then(function() {
          // Wait for session to persist
          var client = window.getSupabase();
          return client.auth.getSession();
        })
        .then(function() {
          window.location.href = 'dashboard.html';
        })
        .catch(function(err) {
          var msg = err.message || 'Erro ao criar conta';
          if (msg.toLowerCase().includes('email') || msg.toLowerCase().includes('already')) {
            showFieldError('email', 'EMAIL JÁ CADASTRADO');
            document.getElementById('reg-email').classList.add('validate-error');
          } else {
            errorEl.textContent = msg;
            errorEl.classList.add('show');
          }
          btn.textContent = orig;
          btn.disabled = false;
        });
    });
    
    // Show error below specific field
    function showFieldError(field, msg) {
      var errEl = document.getElementById(field + '-error');
      if (errEl) {
        errEl.textContent = msg;
        errEl.classList.add('show');
      }
    }
    
    // Clear error on input
    ['reg-email', 'reg-password', 'reg-username', 'reg-displayName'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) {
        el.addEventListener('input', function() {
          this.classList.remove('validate-error');
          var errEl = document.getElementById(id.replace('reg-', '') + '-error');
          if (errEl) errEl.classList.remove('show');
        });
      }
    });
    
    // Password strength indicator
    document.getElementById('reg-password').addEventListener('input', function() {
      var hint = document.getElementById('password-hint');
      if (this.value.length >= 6) {
        hint.textContent = '✓ SENHA VÁLIDA';
        hint.classList.add('error');
        this.classList.remove('validate-error');
        this.classList.add('validate-valid');
      } else {
        hint.textContent = 'Mínimo 6 caracteres';
        hint.classList.remove('error');
        this.classList.remove('validate-valid');
      }
    });
  </script>
</body>
</html>
