<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X-MEN TTRPG // ACESSO RESTRITO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: 
        linear-gradient(180deg, rgba(232,0,28,0.03) 0%, transparent 50%),
        var(--black);
    }

    .auth-logo {
      width: 120px;
      height: 120px;
      margin-bottom: 30px;
      animation: logoIn .6s ease both;
    }
    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .auth-title {
      font-family: var(--disp);
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      color: var(--white);
      letter-spacing: .25em;
      text-align: center;
      margin-bottom: 6px;
      animation: fadeUp .5s ease .2s both;
    }

    .auth-subtitle {
      font-family: var(--mono);
      font-size: .52rem;
      color: var(--muted);
      letter-spacing: .3em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 40px;
      animation: fadeUp .5s ease .3s both;
    }

    .auth-card {
      width: 100%;
      max-width: 340px;
      background: var(--p1);
      border: 1px solid var(--b1);
      padding: 24px;
      animation: fadeUp .5s ease .4s both;
    }

    .auth-tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--b1);
    }

    .auth-tab {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      font-family: var(--cond);
      font-size: .65rem;
      font-weight: 600;
      letter-spacing: .15em;
      color: var(--muted);
      cursor: pointer;
      text-transform: uppercase;
      transition: color .2s;
      position: relative;
    }
    .auth-tab::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--red);
      transform: scaleX(0);
      transition: transform .2s;
    }
    .auth-tab.active {
      color: var(--white);
    }
    .auth-tab.active::after {
      transform: scaleX(1);
    }

    .auth-form {
      display: none;
    }
    .auth-form.active {
      display: block;
    }

    .auth-form .form-group {
      margin-bottom: 14px;
    }

    .auth-form .form-label {
      font-size: .48rem;
    }

    .auth-form .form-input {
      padding: 8px 10px;
      font-size: .85rem;
    }

    .auth-form .role-select {
      display: flex;
      gap: 8px;
    }

    .auth-form .role-btn {
      flex: 1;
      padding: 8px;
      background: var(--p2);
      border: 1px solid var(--b2);
      color: var(--muted);
      font-family: var(--mono);
      font-size: .48rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .15s;
    }
    .auth-form .role-btn:hover {
      border-color: var(--b3);
    }
    .auth-form .role-btn.selected {
      border-color: var(--red);
      color: var(--red);
      background: rgba(232,0,28,.08);
    }

    .auth-form .btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      font-size: .58rem;
    }

    .auth-error {
      background: rgba(232,0,28,.1);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 10px 12px;
      margin-bottom: 14px;
      font-family: var(--mono);
      font-size: .5rem;
      letter-spacing: .05em;
      display: none;
    }
    .auth-error.show {
      display: block;
    }

    .auth-footer {
      margin-top: 20px;
      text-align: center;
      font-family: var(--mono);
      font-size: .42rem;
      color: var(--muted2);
      letter-spacing: .1em;
      animation: fadeUp .5s ease .5s both;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-logo">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 10 L90 90 H60 L50 65 L40 90 H10 Z" fill="#E8001C"/>
        <path d="M50 10 L60 35 L50 50 L40 35 Z" fill="#fff"/>
      </svg>
    </div>
    
    <h1 class="auth-title">XAVIER INSTITUTE</h1>
    <p class="auth-subtitle">Acesso Restrito</p>
    
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Entrar</button>
        <button class="auth-tab" data-tab="register">Cadastrar</button>
      </div>
      
      <div id="error" class="auth-error"></div>
      
      <form id="login-form" class="auth-form active">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" name="email" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label class="form-label">Senha</label>
          <input type="password" class="form-input" name="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary">Acessar</button>
      </form>
      
      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" name="email" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label class="form-label">Senha</label>
          <input type="password" class="form-input" name="password" required minlength="6" placeholder="Mín. 6 caracteres">
        </div>
        <div class="form-group">
          <label class="form-label">Nome de Usuário</label>
          <input type="text" class="form-input" name="username" required placeholder="Usuario" pattern="[a-zA-Z0-9_]+">
        </div>
        <div class="form-group">
          <label class="form-label">Nome de Exibição</label>
          <input type="text" class="form-input" name="displayName" required placeholder="Seu Nome">
        </div>
        <div class="form-group">
          <label class="form-label">Perfil</label>
          <div class="role-select">
            <button type="button" class="role-btn selected" data-role="player">Jogador</button>
            <button type="button" class="role-btn" data-role="gm">Mestre</button>
          </div>
          <input type="hidden" name="role" value="player">
        </div>
        <button type="submit" class="btn btn-primary">Criar Conta</button>
      </form>
    </div>
    
    <p class="auth-footer">X-MEN // CITY OF MIST</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    setTimeout(function() {
      initSupabase();
      checkAuth();
    }, 500);

    const tabs = document.querySelectorAll('.auth-tab');
    const forms = document.querySelectorAll('.auth-form');
    const errorEl = document.getElementById('error');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        forms.forEach(f => f.classList.remove('active'));
        document.getElementById(tab.dataset.tab + '-form').classList.add('active');
        errorEl.classList.remove('show');
      });
    });

    const roleBtns = document.querySelectorAll('.role-btn');
    const roleInput = document.querySelector('input[name="role"]');
    roleBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        roleBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        roleInput.value = btn.dataset.role;
      });
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = e.target.email.value;
      const password = e.target.password.value;
      
      try {
        errorEl.classList.remove('show');
        await login(email, password);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('show');
      }
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = e.target.email.value;
      const password = e.target.password.value;
      const username = e.target.username.value;
      const displayName = e.target.displayName.value;
      const role = e.target.role.value;
      
      try {
        errorEl.classList.remove('show');
        console.log('Registrando:', { email, username, displayName, role });
        await register(email, password, username, displayName, role);
        window.location.href = 'dashboard.html';
      } catch (err) {
        console.error('Erro:', err);
        errorEl.textContent = err.message || 'Erro ao criar conta';
        errorEl.classList.add('show');
      }
    });

    checkAuth();
  </script>
</body>
</html>
