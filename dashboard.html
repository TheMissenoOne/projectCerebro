/* ── DASHBOARD PAGE-LOCAL OVERRIDES ─────────────────────────────── */

/* Staggered page-load reveal */
@keyframes dashIn {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: none; }
}
.dash-animate { animation: dashIn .4s ease both; }
.dash-animate:nth-child(1) { animation-delay: .04s; }
.dash-animate:nth-child(2) { animation-delay: .1s; }
.dash-animate:nth-child(3) { animation-delay: .17s; }
.dash-animate:nth-child(4) { animation-delay: .24s; }

/* ── LAYOUT ──────────────────────────────── */
.dash-body {
  max-width: 1060px;
  margin: 0 auto;
  padding: clamp(20px, 3vw, 36px) clamp(14px, 3vw, 28px) 60px;
}

/* ── IDENTITY ROW ────────────────────────── */
.dash-identity {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 20px 22px;
  background: var(--p1);
  border: 1px solid var(--b1);
  border-left: 3px solid var(--accent);
  margin-bottom: 28px;
  position: relative;
  overflow: hidden;
}
/* subtle diagonal accent */
.dash-identity::after {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 120px; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(var(--accentRGB),.04));
  pointer-events: none;
}

.dash-avatar {
  width: 48px; height: 48px;
  background: var(--p2);
  border: 2px solid var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--disp);
  font-size: 1.5rem;
  color: var(--accent);
  flex-shrink: 0;
  letter-spacing: .05em;
}

.dash-identity-info { flex: 1; min-width: 0; }

.dash-greeting {
  font-family: var(--disp);
  font-size: clamp(1.2rem, 3vw, 1.65rem);
  color: var(--white);
  letter-spacing: .12em;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dash-greeting span { color: var(--accent); }

.dash-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 4px;
  flex-wrap: wrap;
}
.dash-role-badge {
  font-family: var(--mono);
  font-size: .48rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  padding: 3px 8px;
  border: 1px solid var(--accent);
  color: var(--accent);
  background: rgba(var(--accentRGB), .08);
}
.dash-username {
  font-family: var(--mono);
  font-size: .48rem;
  color: var(--muted);
  letter-spacing: .1em;
}

.dash-identity-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

/* ── ENCOUNTER BANNER ────────────────────── */
.encounter-banner {
  display: none;
  padding: 10px 16px;
  background: rgba(192,112,64,.08);
  border: 1px solid rgba(192,112,64,.35);
  border-left: 3px solid #c07040;
  margin-bottom: 20px;
}
.encounter-banner.active { display: flex; align-items: center; gap: 8px; }
.enc-banner-title {
  font-family: var(--mono);
  font-size: .58rem;
  color: #c07040;
  letter-spacing: .14em;
  text-transform: uppercase;
}

/* ── SECTION HEADERS ─────────────────────── */
.dash-section {
  margin-bottom: 28px;
}

.dash-section-header {
  display: flex;
  align-items: center;
  gap: 0;
  margin-bottom: 14px;
}

.section-bar {
  width: 3px;
  height: 18px;
  background: var(--accent);
  margin-right: 10px;
  flex-shrink: 0;
}

.dash-section-title {
  font-family: var(--cond);
  font-size: .78rem;
  font-weight: 700;
  color: var(--white);
  letter-spacing: .2em;
  text-transform: uppercase;
}

.section-line {
  flex: 1;
  height: 1px;
  background: var(--b1);
  margin-left: 12px;
}

/* ── CHARACTER GRID ──────────────────────── */
.chars-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 10px;
}

.char-card {
  background: var(--p1);
  border: 1px solid var(--b1);
  cursor: pointer;
  transition: border-color .15s, transform .15s;
  position: relative;
  overflow: hidden;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  clip-path: polygon(0 0, calc(100% - var(--notch)) 0, 100% var(--notch), 100% 100%, 0 100%);
}
.char-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
}
/* portrait / avatar — flush to card edges, accent rule beneath */
.char-card-img,
.char-avatar {
  width: 100%;
  aspect-ratio: 4 / 5;
  background-size: cover;
  background-position: center top;
  border-bottom: 2px solid var(--b1);
  transition: border-color .15s;
}
.char-card:hover .char-card-img,
.char-card:hover .char-avatar { border-bottom-color: var(--accent); }
.char-avatar {
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--p3), var(--p1));
  font-family: var(--disp);
  font-size: 3.2rem;
  line-height: 1;
  color: var(--b3);
  letter-spacing: .04em;
  transition: color .15s, border-color .15s;
}
.char-card:hover .char-avatar { color: var(--accent); }
/* info readout band */
.char-info {
  padding: 8px 10px 9px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.char-info-name {
  font-family: var(--cond);
  font-size: .82rem;
  font-weight: 700;
  color: var(--white);
  letter-spacing: .06em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: color .15s;
}
.char-card:hover .char-info-name { color: var(--accent); }
.char-info-codename {
  font-family: var(--mono);
  font-size: .46rem;
  color: var(--muted);
  letter-spacing: .14em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.char-info-codename::before { content: "// "; color: var(--accent); opacity: .7; }

/* NEW CHAR CARD */
.char-card-new {
  border-style: dashed;
  border-color: var(--b2);
  background: transparent;
  min-height: 76px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.char-card-new:hover {
  border-color: var(--accent);
  border-style: solid;
  background: rgba(var(--accentRGB), .04);
  transform: none;
}
.char-card-new svg {
  width: 20px; height: 20px;
  stroke: var(--b3);
  transition: stroke .15s;
}
.char-card-new:hover svg { stroke: var(--accent); }
.char-card-new span {
  font-family: var(--mono);
  font-size: .46rem;
  color: var(--muted2);
  letter-spacing: .14em;
  transition: color .15s;
}
.char-card-new:hover span { color: var(--accent); }

/* ── PARTY PANEL ─────────────────────────── */
.party-section {
  background: var(--p1);
  border: 1px solid var(--b1);
  overflow: hidden;
}

/* Empty state */
.party-empty {
  padding: 32px 24px;
  text-align: center;
}
.party-empty-icon {
  font-size: 2rem;
  margin-bottom: 10px;
  opacity: .4;
}
.party-empty p {
  font-family: var(--mono);
  font-size: .56rem;
  color: var(--muted);
  letter-spacing: .1em;
  margin-bottom: 20px;
  line-height: 1.7;
}
.party-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}
.party-actions .btn {
  font-size: .56rem;
  padding: 9px 18px;
}

/* Party Info */
.party-info {
  display: none;
  flex-direction: column;
}
.party-info-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--b1);
  background: var(--p2);
}
.party-name-display {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.party-name {
  font-family: var(--disp);
  font-size: 1.3rem;
  color: var(--white);
  letter-spacing: .12em;
  line-height: 1;
}
.party-code {
  font-family: var(--mono);
  font-size: .48rem;
  color: var(--muted);
  letter-spacing: .1em;
}
.party-code strong {
  color: var(--accent);
  font-weight: normal;
  letter-spacing: .14em;
}

.party-body {
  padding: 16px 20px;
  display: flex;
  align-items: flex-start;
  gap: 20px;
  flex-wrap: wrap;
}

.party-members-label {
  font-family: var(--mono);
  font-size: .46rem;
  color: var(--muted2);
  letter-spacing: .14em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.party-members {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.party-member {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--mono);
  font-size: .52rem;
  color: var(--text);
  background: var(--p3);
  padding: 4px 10px;
  border: 1px solid var(--b1);
  letter-spacing: .06em;
}
.party-member.is-gm {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(var(--accentRGB), .06);
}
.party-gm-badge {
  font-size: .38rem;
  letter-spacing: .08em;
  opacity: .7;
}
.party-member-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--b3);
  flex-shrink: 0;
}
.party-member.is-gm .party-member-dot { background: var(--accent); }

.party-admin-link {
  display: none;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: rgba(var(--accentRGB), .1);
  border: 1px solid var(--accent);
  color: var(--accent);
  font-family: var(--mono);
  font-size: .5rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  text-decoration: none;
  transition: background .15s, color .15s;
  margin-left: auto;
  flex-shrink: 0;
  align-self: flex-start;
}
.party-admin-link:hover {
  background: var(--accent);
  color: var(--black);
  text-decoration: none;
}

/* ── MODALS ──────────────────────────────── */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.82);
  z-index: 500;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal.open { display: flex; }

.modal-card {
  background: var(--p1);
  border: 1px solid var(--b2);
  border-top: 3px solid var(--accent);
  padding: 26px 24px;
  width: 100%;
  max-width: 360px;
  animation: dashIn .25s ease both;
}
.modal-title {
  font-family: var(--disp);
  font-size: 1.3rem;
  color: var(--white);
  letter-spacing: .15em;
  margin-bottom: 20px;
  line-height: 1;
}
.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 20px;
}
.modal-actions .btn { flex: 1; justify-content: center; }

/* ── THEME SWITCHER ──────────────────────── */
.theme-switcher {
  display: flex;
  align-items: center;
  gap: 3px;
}
.th-btn {
  padding: 5px !important;
  min-width: unset !important;
  border: 1px solid var(--b2) !important;
  border-radius: 50% !important;
  transition: border-color .15s, transform .15s !important;
}
.th-btn:hover {
  border-color: var(--accent) !important;
  transform: scale(1.2);
}
.th-btn span {
  width: 10px !important;
  height: 10px !important;
  border-radius: 50%;
  display: block;
}

/* ── RESPONSIVE ──────────────────────────── */
@media (max-width: 600px) {
  .dash-identity { gap: 12px; padding: 14px 16px; }
  .dash-avatar { width: 40px; height: 40px; font-size: 1.2rem; }
  .dash-greeting { font-size: 1rem; }
  .chars-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .party-body { gap: 12px; }
  .party-admin-link { margin-left: 0; }
}

  left: 50%;
  transform: translateX(-50%);

  color: var(--white);
  padding: 12px 20px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 0.85rem;
  z-index: 9999;
  opacity: 0;

  pointer-events: none;
  max-width: 90%;
  word-wrap: break-word;
  text-align: center;
">—</div>

<!-- ═══════════════════════════ SCRIPTS ═══════════════════════════ -->
<!-- Scripts already loaded in <head> -->
<script>
// Toast notification
function toast(msg) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = '// ' + msg;
  el.style.opacity = '1';
  clearTimeout(el._timeout);
  el._timeout = setTimeout(function() {
    el.style.opacity = '0';
  }, 2600);
}

</script>

<script>
// Populate user info in header
function populateUserInfo(user, profile) {
  var userNameEl = document.getElementById('user-name');
  var userAvatarEl = document.getElementById('user-avatar');
  var userRoleEl = document.getElementById('user-role');
  var userDisplayEl = document.getElementById('user-display');
  var userCodeEl = document.getElementById('hdr-user-code');
  
  var displayName = profile?.display_name || profile?.username || user?.email || t('dash.fallbackName');
  var initial = displayName.charAt(0).toUpperCase();
  var role = profile?.role === 'gm' ? t('dash.gm') : t('dash.player');
  var username = profile?.username || user?.email?.split('@')[0] || t('dash.fallbackUser');
  
  if (userNameEl) userNameEl.textContent = displayName;
  if (userAvatarEl) userAvatarEl.textContent = initial;
  if (userRoleEl) userRoleEl.textContent = role;
  if (userDisplayEl) userDisplayEl.textContent = username.toUpperCase();
  if (userCodeEl) userCodeEl.textContent = username.toUpperCase();
}

// Dashboard initialization
window.addEventListener('DOMContentLoaded', function() {
  initLanguage();
  applyTranslations();
  initTheme();
  
  requireAuth().then(function(auth) {
    if (!auth) return;
    
    var userId = auth.session.user.id;
    
    renderNavBar({ page: 'dashboard', userCode: auth.session.user.email || '—' });
    setGMFlag(false);
    
    window.getProfile(userId).then(function(profile) {
      populateUserInfo(auth.session.user, profile);
      if (profile && profile.role === 'gm') setGMFlag(true);
    }).catch(function(err) {
      populateUserInfo(auth.session.user, null);
    });
    
    window.listCharacters(userId, true).then(function(chars) {
      populateCharacterGrid(chars);
    }).catch(function(err) {
      console.error('Error loading characters:', err);
    });

    window.getPlayerParty(userId).then(function(party) {
      if (party) {
        populatePartyInfo(party, userId);
      }
    }).catch(function(err) {
      console.error('Error loading party:', err);
    });
    
    bindDashboardEvents();
  }).catch(function(err) {
    console.error('Auth error:', err);
  });
});

// Theme handled by themes.js + header.js

function populateCharacterGrid(chars) {
  var grid = document.getElementById('chars-grid');
  if (!grid) return;

  // Keep new char button
  var newBtn = grid.querySelector('.char-card-new');
  grid.innerHTML = '';
  if (newBtn) grid.appendChild(newBtn);

  // Add character cards
  if (chars && chars.length > 0) {
    chars.forEach(function(char) {
      var card = document.createElement('a');
      card.className = 'char-card';
      card.href = 'ficha.html?id=' + char.id;
      var foto = char.foto_base64 || '';
      var topNome = char.name && char.name.trim();
      var dataNome = char.data && char.data.nome && char.data.nome.trim();
      var charName = topNome || dataNome || t('dash.newChar');
      var topCodinome = char.codename && char.codename.trim();
      var dataCodinome = char.data && char.data.codinome && char.data.codinome.trim();
      var charCodinome = topCodinome || dataCodinome || '—';
      var nameForInitial = charCodinome !== '—' ? charCodinome : charName;
      var initial = nameForInitial.charAt(0).toUpperCase();
      if (foto) {
      card.innerHTML = '<div class="char-card-img" style="background-image:url(' + foto + ')"></div><div class="char-info"><div class="char-info-name">' + charName + '</div><div class="char-info-codename">' + charCodinome + '</div></div>';
      } else {
      card.innerHTML = '<div class="char-avatar">' + initial + '</div><div class="char-info"><div class="char-info-name">' + charName + '</div><div class="char-info-codename">' + charCodinome + '</div></div>';
      }
      grid.appendChild(card);
    });
  }
}

function populatePartyInfo(party, playerId) {
  var emptyState = document.getElementById('party-empty');
  var infoState = document.getElementById('party-info');
  if (!infoState || !emptyState) return;

  // Show party info, hide empty
  emptyState.style.display = 'none';
  infoState.style.display = 'block';

  // Set party name and code
  var nameEl = document.getElementById('party-name');
  var codeEl = document.getElementById('party-code');
  if (nameEl) nameEl.textContent = party.name || t('dash.party');
  if (codeEl) codeEl.textContent = party.code || '—';

  // Show admin link if current user is GM
  var adminLink = document.getElementById('admin-party-link');
  if (adminLink && party.gm_id === playerId) {
    adminLink.style.display = 'inline-flex';
  }

  // Load and display members
  window.getPartyMembers(party.id).then(function(members) {
    var membersContainer = document.getElementById('party-members');
    if (membersContainer) {
      membersContainer.innerHTML = '';
      if (members && members.length > 0) {
        members.forEach(function(member) {
          var memberEl = document.createElement('div');
          memberEl.className = 'party-member';
          memberEl.textContent = member.name || t('dash.member');
          membersContainer.appendChild(memberEl);
        });
      }
    }
  });
}

function bindDashboardEvents() {
  // New character button
  var newBtn = document.getElementById('new-char-btn');
  if (newBtn) {
    newBtn.addEventListener('click', function(e) {
      e.preventDefault();
      window.location.href = 'ficha.html?new=true';
    });
  }

  // Create party button
  var createPartyBtn = document.getElementById('create-party-btn');
  if (createPartyBtn) {
    createPartyBtn.addEventListener('click', function() {
      var modal = document.getElementById('create-party-modal');
      if (modal) modal.style.display = 'flex';
    });
  }

  // Cancel create party
  var cancelCreateParty = document.getElementById('cancel-create-party');
  if (cancelCreateParty) {
    cancelCreateParty.addEventListener('click', function() {
      var modal = document.getElementById('create-party-modal');
      if (modal) modal.style.display = 'none';
    });
  }

    // Confirm create party
  var confirmCreateParty = document.getElementById('confirm-create-party');
  if (confirmCreateParty) {
    confirmCreateParty.addEventListener('click', function() {
      var input = document.getElementById('party-name-input');
      if (input && input.value.trim()) {
        requireAuth().then(function(auth) {
          if (!auth) return;
          var userId = auth.session.user.id;
           window.createParty(input.value.trim(), userId).then(function() {
             toast(t('dash.partyCreated'));
             var modal = document.getElementById('create-party-modal');
             if (modal) modal.style.display = 'none';
             input.value = '';
             // Clear cache and reload party info
             if (window.cache) {
               window.cache.invalidate('gm_party', userId);
               window.cache.invalidate('player_party', userId);
             }
             window.getPlayerParty(userId).then(function(party) {
               if (party) populatePartyInfo(party, userId);
             }).catch(function(err) {
               toast(t('dash.errorLoadParty'));
               console.error('Error loading party:', err);
             });
           }).catch(function(err) {
             toast(t('dash.errorCreateParty'));
             console.error('Error creating party:', err);
           });
         });
      }
    });
  }

  // Join party button
  var joinPartyBtn = document.getElementById('join-party-btn');
  if (joinPartyBtn) {
    joinPartyBtn.addEventListener('click', function() {
      var modal = document.getElementById('join-party-modal');
      if (modal) modal.style.display = 'flex';
    });
  }

  // Cancel join party
  var cancelJoinParty = document.getElementById('cancel-join-party');
  if (cancelJoinParty) {
    cancelJoinParty.addEventListener('click', function() {
      var modal = document.getElementById('join-party-modal');
      if (modal) modal.style.display = 'none';
    });
  }

  // Confirm join party
  var confirmJoinParty = document.getElementById('confirm-join-party');
  if (confirmJoinParty) {
    confirmJoinParty.addEventListener('click', function() {
      var input = document.getElementById('party-code-input');
      if (input && input.value.trim()) {
        requireAuth().then(function(auth) {
          if (!auth) return;
          var userId = auth.session.user.id;
          window.getPartyByCode(input.value.trim()).then(function(party) {
            if (party) {
              return window.joinParty(party.id, userId).then(function() {
                toast(t('dash.joinedParty') + ' ' + party.name);
                var modal = document.getElementById('join-party-modal');
                if (modal) modal.style.display = 'none';
                input.value = '';
                // Clear cache before reloading
                if (window.cache) {
                  window.cache.invalidate('player_party', userId);
                }
                populatePartyInfo(party, userId);
              }).catch(function(err) {
                toast(t('dash.errorJoinParty'));
                console.error('Error joining party:', err);
              });
            } else {
              toast(t('dash.partyNotFound'));
            }
          }).catch(function(err) {
            toast(t('dash.errorFindParty'));
            console.error('Error finding party:', err);
          });
        });
      }
    });
  }

  // Close modals on outside click
  document.querySelectorAll('.modal').forEach(function(modal) {
    modal.addEventListener('click', function(e) {
      if (e.target === modal) {
        modal.style.display = 'none';
      }
    });
  });
}
</script>
</body>
</html>
