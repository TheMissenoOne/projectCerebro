<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X-MEN TTRPG // DASHBOARD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    .dashboard { padding-bottom: 40px; }
    
    .dash-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }
    
    .dash-welcome h2 {
      font-family: var(--disp);
      font-size: clamp(1.4rem, 4vw, 1.8rem);
      color: var(--white);
      letter-spacing: .1em;
    }
    .dash-welcome p {
      font-family: var(--mono);
      font-size: .48rem;
      color: var(--muted);
      letter-spacing: .1em;
      margin-top: 4px;
    }
    
    .dash-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dash-user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--p2);
      border: 1px solid var(--b2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--muted);
    }
    .dash-user-name {
      font-family: var(--mono);
      font-size: .52rem;
      color: var(--text);
    }
    .dash-user-role {
      font-family: var(--mono);
      font-size: .4rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .1em;
    }
    .dash-logout {
      background: none;
      border: 1px solid var(--b2);
      color: var(--muted);
      padding: 6px 10px;
      font-family: var(--mono);
      font-size: .46rem;
      cursor: pointer;
      transition: all .15s;
    }
    .dash-logout:hover {
      border-color: var(--red);
      color: var(--red);
    }

    .dash-section {
      margin-bottom: 28px;
    }
    
    .dash-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    
    .dash-section-title {
      font-family: var(--cond);
      font-size: .7rem;
      font-weight: 700;
      color: var(--white);
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .chars-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .char-card {
      background: var(--p1);
      border: 1px solid var(--b1);
      padding: 14px;
      cursor: pointer;
      transition: all .15s;
      position: relative;
    }
    .char-card:hover {
      border-color: var(--red);
      transform: translateY(-2px);
    }
    .char-card-name {
      font-family: var(--cond);
      font-size: .82rem;
      font-weight: 700;
      color: var(--white);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .char-card-codename {
      font-family: var(--mono);
      font-size: .44rem;
      color: var(--muted);
      letter-spacing: .08em;
    }
    .char-card-new {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80px;
      border: 1px dashed var(--b2);
      color: var(--muted);
    }
    .char-card-new svg {
      width: 24px;
      height: 24px;
      stroke: var(--b3);
      margin-bottom: 6px;
    }
    .char-card-new span {
      font-family: var(--mono);
      font-size: .44rem;
      letter-spacing: .1em;
    }

    .party-section {
      background: var(--p1);
      border: 1px solid var(--b1);
      padding: 16px;
    }

    .party-empty {
      text-align: center;
      padding: 20px;
    }
    .party-empty p {
      font-family: var(--mono);
      font-size: .52rem;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .party-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .party-actions .btn {
      padding: 8px 14px;
      font-size: .5rem;
    }

    .party-info {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .party-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .party-name {
      font-family: var(--disp);
      font-size: 1.2rem;
      color: var(--white);
      letter-spacing: .1em;
    }
    .party-code {
      font-family: var(--mono);
      font-size: .52rem;
      color: var(--accent2);
      letter-spacing: .1em;
      background: var(--p2);
      padding: 4px 8px;
      border: 1px solid var(--b2);
    }
    .party-members {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .party-member {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--p2);
      padding: 4px 8px;
      font-family: var(--mono);
      font-size: .46rem;
      color: var(--text);
    }
    .party-member.is-gm {
      color: var(--accent);
    }
    .party-gm-badge {
      font-size: .36rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .party-admin-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 6px 12px;
      background: var(--accent);
      color: var(--black);
      font-family: var(--mono);
      font-size: .48rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .party-admin-link:hover {
      background: var(--accent2);
      text-decoration: none;
    }

    .encounter-banner {
      background: rgba(192,112,64,.1);
      border: 1px solid rgba(192,112,64,.4);
      border-left: 3px solid #c07040;
      padding: 12px 14px;
      margin-bottom: 20px;
      display: none;
    }
    .encounter-banner.active {
      display: block;
    }
    .enc-banner-title {
      font-family: var(--mono);
      font-size: .52rem;
      color: #c07040;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.8);
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.open { display: flex; }
    .modal-card {
      background: var(--p1);
      border: 1px solid var(--b1);
      padding: 24px;
      width: 100%;
      max-width: 360px;
    }
    .modal-title {
      font-family: var(--disp);
      font-size: 1.2rem;
      color: var(--white);
      letter-spacing: .1em;
      margin-bottom: 16px;
    }
    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .modal-actions .btn { flex: 1; }
  </style>
</head>
<body>
<script>
(function(){
  var t = localStorage.getItem('cerebro_tema');
  if (t) document.body.className = 'theme-' + t;
})();
</script>

  <div class="toolbar">
    <span class="save-ind salvo">●</span>
    <div class="toolbar-divider"></div>
    <a href="ficha.html?new=true" class="tbtn">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nova Ficha
    </a>
    <div class="toolbar-divider"></div>
    <a href="cerebro.html" class="tbtn">Cérebro</a>
    <a href="wiki.html" class="tbtn">Wiki</a>
    <a href="combate.html" class="tbtn" id="combate-link" style="display:none;">Combate</a>
    <a href="admin.html" class="tbtn" id="admin-link" style="display:none;">Admin</a>
    <div class="toolbar-spacer"></div>
    <div class="theme-switcher">
      <button class="tbtn th-btn" onclick="setTema('yellow')" title="Amarelo" style="padding:4px 6px;min-width:24px;"><span style="width:8px;height:8px;border-radius:50%;background:#FFD600;display:block;"></span></button>
      <button class="tbtn th-btn" onclick="setTema('red')" title="Vermelho" style="padding:4px 6px;min-width:24px;"><span style="width:8px;height:8px;border-radius:50%;background:#E8001C;display:block;"></span></button>
      <button class="tbtn th-btn" onclick="setTema('green')" title="Verde" style="padding:4px 6px;min-width:24px;"><span style="width:8px;height:8px;border-radius:50%;background:#00C853;display:block;"></span></button>
      <button class="tbtn th-btn" onclick="setTema('purple')" title="Roxo" style="padding:4px 6px;min-width:24px;"><span style="width:8px;height:8px;border-radius:50%;background:#b040ff;display:block;"></span></button>

  <div class="content dashboard">
    <div id="encounter-banner" class="encounter-banner">
      <span class="enc-banner-title">⚔️ Encontro Ativo!</span>
    </div>

    <div class="dash-header">
      <div class="dash-welcome">
        <h2>Bem-vindo, <span id="user-name">...</span></h2>
        <p><span id="user-role">JOGADOR</span></p>
      </div>
      <div class="dash-user">
        <div class="dash-user-avatar" id="user-avatar">?</div>
        <div>
          <div class="dash-user-name" id="user-display">...</div>
          <div class="dash-user-role" id="user-role-display">JOGADOR</div>
        </div>
        <button class="dash-logout" id="logout-btn">Sair</button>
      </div>
    </div>

    <div class="dash-section">
      <div class="dash-section-header">
        <span class="dash-section-title">Personagens</span>
      </div>
      <div class="chars-grid" id="chars-grid">
        <div class="char-card char-card-new" id="new-char-btn">
          <svg viewBox="0 0 24 24" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>NOVA FICHA</span>
        </div>
      </div>
    </div>

    <div class="dash-section">
      <div class="dash-section-header">
        <span class="dash-section-title">Party</span>
      </div>

        <div class="party-empty" id="party-empty">
          <p>Você ainda não faz parte de uma party.</p>
          <div class="party-actions">
            <button class="btn" id="create-party-btn">Criar Party</button>
            <button class="btn" id="join-party-btn">Entrar com Código</button>
          </div>
        </div>
        <div class="party-info" id="party-info" style="display: none;">
          <div class="party-header">
            <span class="party-name" id="party-name">...</span>
            <span class="party-code">Código: <span id="party-code">...</span></span>
          </div>
          <div class="party-members" id="party-members"></div>
          <a href="admin.html" class="party-admin-link" id="admin-link" style="display: none;">
            ⚔️ Gerenciar Party
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="create-party-modal">
    <div class="modal-card">
      <h3 class="modal-title">Criar Party</h3>
      <div class="form-group">
        <label class="form-label">Nome da Party</label>
        <input type="text" class="form-input" id="party-name-input" placeholder="X-Men Squad">
      </div>
      <div class="modal-actions">
        <button class="btn" id="cancel-create-party">Cancelar</button>
        <button class="btn btn-primary" id="confirm-create-party">Criar</button>
      </div>
    </div>
  </div>

  <div class="modal" id="join-party-modal">
    <div class="modal-card">
      <h3 class="modal-title">Entrar na Party</h3>
      <div class="form-group">
        <label class="form-label">Código de Acesso</label>
        <input type="text" class="form-input" id="party-code-input" placeholder="ABC123" maxlength="6" style="text-transform: uppercase;">
      </div>
      <div class="modal-actions">
        <button class="btn" id="cancel-join-party">Cancelar</button>
        <button class="btn btn-primary" id="confirm-join-party">Entrar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/themes.js"></script>
  <script src="assets/js/music.js"></script>
  <script>
    var currentUser = null;
    var currentProfile = null;
    var currentParty = null;

    function init() {
      initTheme();
      renderThemeDots();
      
      requireAuth().then(function(auth) {
        if (!auth) return;
        
        currentUser = auth.session.user;
        currentProfile = auth.profile;
        
        document.getElementById('user-name').textContent = currentProfile.username;
        document.getElementById('user-display').textContent = currentProfile.display_name;
        document.getElementById('user-avatar').textContent = currentProfile.username.charAt(0).toUpperCase();
        
        var roleLabel = currentProfile.role === 'gm' ? 'MESTRE' : 'JOGADOR';
        document.getElementById('user-role').textContent = roleLabel;
        document.getElementById('user-role-display').textContent = roleLabel;
        
        showGMControls();
        initMusicPlayer();
        
        loadCharacters().catch(function(e) { console.error('loadCharacters:', e); });
        loadParty().catch(function(e) { console.error('loadParty:', e); });
        
        // Polling: refresh data every 15 seconds
        setInterval(function() {
          loadCharacters().catch(function(e) { console.error('polling chars:', e); });
          loadParty().catch(function(e) { console.error('polling party:', e); });
        }, 15000);
      }).catch(function(e) {
        console.error('init error:', e);
      });
    }

    function loadCharacters() {
      return api.listCharacters(currentUser.id).then(function(chars) {
        var grid = document.getElementById('chars-grid');
        var newBtn = document.getElementById('new-char-btn');
        
        // Clear existing character cards (but keep new button)
        var existingCards = grid.querySelectorAll('.char-card:not(.char-card-new)');
        existingCards.forEach(function(card) { card.remove(); });
        
        chars.forEach(function(char) {
          var card = document.createElement('div');
          card.className = 'char-card';
          card.innerHTML = '<div class="char-card-name">' + (char.name || 'Sem Nome') + '</div>' +
            '<div class="char-card-codename">' + (char.codename || '') + '</div>';
          card.addEventListener('click', function() {
            window.location.href = 'ficha.html?id=' + char.id;
          });
          grid.insertBefore(card, newBtn);
        });
      });
    }

    function loadParty() {
      console.log('[DEBUG] loadParty called, userId:', currentUser.id);
      return api.getPlayerParty(currentUser.id)
        .then(function(party) {
          console.log('[DEBUG] getPlayerParty result:', party);
          if (!party && currentProfile && currentProfile.role === 'gm') {
            console.log('[DEBUG] No party found, trying getGMParty');
            return api.getGMParty(currentUser.id).then(function(p) {
              console.log('[DEBUG] getGMParty result:', p);
              return showParty(p);
            });
          }
          return showParty(party);
        })
        .catch(function(err) {
          console.error('[DEBUG] loadParty error:', err);
        });
    }

    function showParty(party) {
      console.log('[DEBUG] showParty called with:', party);
      if (!party) {
        console.log('[DEBUG] No party, keeping empty state');
        return;
      }
      currentParty = party;
      document.getElementById('party-empty').style.display = 'none';
      document.getElementById('party-info').style.display = 'flex';
      document.getElementById('party-name').textContent = party.name;
      document.getElementById('party-code').textContent = party.code;
      document.getElementById('combate-link').style.display = 'flex';
      
      if (currentProfile && currentProfile.role === 'gm') {
        document.getElementById('admin-link').style.display = 'inline-flex';
      }
      
      return api.getPartyMembers(party.id).then(function(members) {
        var membersEl = document.getElementById('party-members');
        membersEl.innerHTML = '';
        members.forEach(function(m) {
          var isGm = m.player_id === party.gm_id;
          var name = m.display_name || m.username || 'Unknown';
          var memberEl = document.createElement('div');
          memberEl.className = 'party-member' + (isGm ? ' is-gm' : '');
          memberEl.innerHTML = name + (isGm ? ' <span class="party-gm-badge">(GM)</span>' : '');
          membersEl.appendChild(memberEl);
        });
      });
    }

    document.getElementById('new-char-btn').addEventListener('click', function() {
      api.createCharacter(currentUser.id, currentParty ? currentParty.id : null).then(function(char) {
        window.location.href = 'ficha.html?id=' + char.id;
      }).catch(function(e) {
        alert('Erro ao criar personagem: ' + e.message);
      });
    });

    document.getElementById('logout-btn').addEventListener('click', function() {
      logout();
    });

    // Show create party button only for GMs (inside callback)
    function showGMControls() {
      if (currentProfile && currentProfile.role === 'gm') {
        var createBtn = document.getElementById('create-party-btn');
        if (createBtn) createBtn.style.display = 'inline-block';
      } else {
        var createBtn = document.getElementById('create-party-btn');
        if (createBtn) createBtn.style.display = 'none';
      }
    }

    document.getElementById('create-party-btn').addEventListener('click', function() {
      document.getElementById('create-party-modal').classList.add('open');
    });

    document.getElementById('join-party-btn').addEventListener('click', function() {
      document.getElementById('join-party-modal').classList.add('open');
    });

    document.getElementById('cancel-create-party').addEventListener('click', function() {
      document.getElementById('create-party-modal').classList.remove('open');
    });

    document.getElementById('cancel-join-party').addEventListener('click', function() {
      document.getElementById('join-party-modal').classList.remove('open');
    });

    document.getElementById('confirm-create-party').addEventListener('click', function() {
      var name = document.getElementById('party-name-input').value;
      if (!name) return;
      
      console.log('[DEBUG] Creating party:', name);
      api.createParty(name, currentUser.id).then(function(party) {
        console.log('[DEBUG] Party created:', party);
        return api.joinParty(party.id, currentUser.id).then(function() {
          console.log('[DEBUG] Joined party');
          document.getElementById('create-party-modal').classList.remove('open');
          return loadParty();
        });
      }).catch(function(e) {
        console.error('[DEBUG] Error creating party:', e);
        alert('Erro ao criar party: ' + e.message);
      });
    });

    document.getElementById('confirm-join-party').addEventListener('click', function() {
      var code = document.getElementById('party-code-input').value;
      if (!code) return;
      
      api.getPartyByCode(code).then(function(party) {
        if (!party) {
          alert('Código inválido!');
          return;
        }
        return api.joinParty(party.id, currentUser.id).then(function() {
          document.getElementById('join-party-modal').classList.remove('open');
          return loadParty();
        });
      }).catch(function(e) {
        alert('Erro ao entrar na party: ' + e.message);
      });
    });

    function toggleSettings() {
      document.getElementById('settings-dropdown').classList.toggle('open');
    }
    
    function renderThemeDots() {
      var themes = [
        { id: 'yellow', color: '#FFD600' },
        { id: 'red', color: '#E8001C' },
        { id: 'green', color: '#00C853' },
        { id: 'purple', color: '#b040ff' },
        { id: 'blue', color: '#3a8fc0' }
      ];
      var current = getCurrentTheme();
      var container = document.getElementById('theme-dots-row');
      container.innerHTML = themes.map(function(t) {
        return '<div class="theme-dot-sm ' + (t.id === current ? 'active' : '') + '" style="background:' + t.color + '" onclick="setTheme(\'' + t.id + '\');renderThemeDots();" title="' + t.name + '"></div>';
      }).join('');
    }
    
    document.addEventListener('click', function(e) {
      var dropdown = document.getElementById('settings-dropdown');
      var btn = document.querySelector('.hdr-settings-btn');
      if (!dropdown.contains(e.target) && !btn.contains(e.target)) {
        dropdown.classList.remove('open');
      }
    });

    init();
  </script>
</body>
</html>
