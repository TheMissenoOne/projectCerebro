services:
  - type: web
    name: xmen-ttrpg-server
    env: node
    rootDirectory: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production

  - type: static
    name: xmen-ttrpg-frontend
    buildCommand: ""
    publishDir: "."
    envVars:
      - key: API_URL
        value: https://projectcerebro.onrender.com
