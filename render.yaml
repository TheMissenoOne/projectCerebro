services:
  - type: web
    name: xmen-ttrpg-server
    env: node
    buildCommand: cd server && npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

  - type: static
    name: xmen-ttrpg-frontend
    buildCommand: ""
    publishDir: "."
    envVars:
      - key: API_URL
        value: https://xmen-ttrpg-server.onrender.com
