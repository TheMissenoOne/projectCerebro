databases:
  - name: xmen-db
    plan: free
    databaseName: xmen
    user: xmen

services:
  - type: web
    name: xmen-ttrpg
    env: node
    rootDirectory: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: xmen-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
