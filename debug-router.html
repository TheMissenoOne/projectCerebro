<!DOCTYPE html>
<html>
<head>
  <script src="app/core/state.js"></script>
  <script src="app/core/router.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Test router matching
      console.log('Testing router matching...');
      
      // Register test routes
      Router.add('/test/:id', (container, params) => {
        console.log('Matched /test/:id with params:', params);
        container.innerHTML = `<p>Matched test/:id with ${JSON.stringify(params)}</p>`;
      });
      
      Router.add('/ficha/:id', (container, params) => {
        console.log('Matched /ficha/:id with params:', params);
        container.innerHTML = `<p>Matched ficha/:id with ${JSON.stringify(params)}</p>`;
      });
      
      Router.init();
      
      // Test navigation
      Router.navigate('/test/123');
      Router.navigate('/ficha/456');
      
      // Test current route
      setTimeout(() => {
        console.log('Current route:', Router.current);
        console.log('Routes object:', Router.routes);
      }, 100);
    });
  </script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
