<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>X-MEN TTRPG</title>
  <script>
    /**
     * GitHub Pages SPA redirect.
     *
     * When GitHub Pages can't find a file for a URL like /projectCerebro/dashboard,
     * it serves this 404.html. We encode the intended path into the query string
     * and redirect to index.html, which will decode it and hand it to the router.
     *
     * pathSegmentsToKeep = 1  →  keeps the repo name (/projectCerebro) in the URL.
     * Set to 0 if you're using a custom domain (site lives at the root).
     */
    var pathSegmentsToKeep = 1;

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
