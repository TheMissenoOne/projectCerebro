<!DOCTYPE html>
<html>
<head>
  <script src="assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="app/core/state.js"></script>
  <script>
    // Override Router._load to add debugging
    const originalLoad = Router._load;
    Router._load = async function(path) {
      console.log('[_load] Attempting to load path:', path);
      console.log('[_load] Available routes:', Object.keys(this.routes));
      
      const [routePath, query] = path.split('?');
      console.log('[_load] routePath:', routePath, 'query:', query);
      
      // Check exact match
      if (this.routes[routePath]) {
        console.log('[_load] Found exact match for:', routePath);
      } else {
        console.log('[_load] No exact match for:', routePath);
        // Check pattern match
        const patternKeys = Object.keys(this.routes).filter(p => p.includes(':'));
        console.log('[_load] Pattern routes:', patternKeys);
        for (const pattern of patternKeys) {
          const patternParts = pattern.split('/');
          const routeParts = routePath.split('/');
          if (patternParts.length === routeParts.length) {
            console.log('[_load] Pattern match:', pattern, 'with routeParts:', routeParts);
            for (let i = 1; i < patternParts.length; i++) {
              if (patternParts[i].startsWith(':')) {
                console.log('[_load] Param:', patternParts[i].slice(1), '=', routeParts[i]);
              }
            }
          }
        }
      }
      
      return originalLoad.call(this, path);
    };
  </script>
  <script src="app/core/router.js"></script>
  <script src="app/services/auth.js"></script>
  <script src="app/services/api.js"></script>
  <script src="app/app.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      console.log('=== ROUTER DEBUG ===');
      console.log('Initial routes:', Object.keys(Router.routes));
      window.App.init();
    });
  </script>
</body>
</html>
